/* ===== Card view: header, at a glance, alerts, tabs (or a full page when expanded) ===== */
const PERSON_COLORS = ['#3F4A5A', '#6100DB', '#0E7490', '#B45309', '#1F7A4D', '#BE185D'];
function personColor(d, n) { const k = d.team.findIndex(p => p.name === n); return PERSON_COLORS[(k < 0 ? 0 : k) % PERSON_COLORS.length]; }
function dayLabel(x) { return DOW[x.getDay()] + ', ' + fmt(x); }

// Brief and replies load when a card opens (the first load only carries a summary)
function loadCard(i) {
  i.loading = true;
  google.script.run
    .withSuccessHandler(x => { i.loading = false; i.full = true; i.brief = x.brief || ''; i.replies = (x.replies || []).map(r => ({ ...r, d: r.at ? new Date(r.at) : null })); if (S.detail === i.id) renderLayer(); })
    .withFailureHandler(err => { i.loading = false; i.full = true; toast('Could not load the brief: ' + err.message); if (S.detail === i.id) renderLayer(); })
    .getCardDetail(i.id);
}

function cardAlerts(i, d) {
  const out = [];
  if (i.open && i.needsSplit && i.est) out.push(['Set the split', 'warn', `${i.team.filter(n => i.overs.indexOf(n) === -1).length} people are on this, so their ${i.handsEst.toFixed(1)} d are split evenly for now. Open <b>People and days</b> to set each person's days and when they work on it.`]);
  (i.leavers || []).forEach(n => {
    const p = d.people.find(x => x.name === n);
    const opts = d.people.filter(x => x.name !== n && x.projectRole !== 'Oversight' && !(x.lastD && x.lastD < i.e));
    out.push(['Hand-over needed', 'warn', `<b>${esc(n)} leaves ${dayLabel(p.lastD)}</b>, before this ends ${fmt(i.e)}. Hand ${i.est ? 'their ' + daysFor(i, n).toFixed(1) + ' d' : 'it'}${n === i.lead ? ' and the lead' : ''} to:
      <span class="row" style="margin-top:6px"><select id="handTo" class="sel">${opts.map(x => `<option>${esc(x.name)}</option>`).join('')}</select><button class="btn ghost" data-act="handover" data-id="${esc(i.id)}" data-from="${esc(n)}">Hand over</button></span>
      <span class="sub">Also reassign the to-do in Basecamp so the sync keeps it with the new person.</span>`]);
  });
  if (i.tlFlag) out.push([i.tlFlag.kind === 'mention' ? 'Possible timeline change' : i.tlFlag.kind === 'due' ? 'Due date moved' : 'Schedule changed', 'warn',
    `<b>${esc(i.tlFlag.by)}</b>, ${esc(whenLabel(i.tlFlag.at, d.TODAY))}<ul style="margin:6px 0 0;padding-left:18px">${(i.tlFlag.changes || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>${i.tlFlag.kind === 'mention' ? '<span class="sub">Read from a reply. Update the to-do\'s due date or WBS if the timing really moved.</span>' : ''}`]);
  if (i.mismatch) out.push(['Dates differ', 'warn', `The work back schedule ends ${dayLabel(i.wbsEnd)}, but Basecamp says it's due ${dayLabel(i.dueBC)}. Update the to-do's due date, or confirm ${fmt(i.dueBC)} is an internal date.`]);
  (i.dupOf || []).forEach(o => { const y = d.items.find(x => x.id === o); if (y) out.push(['Possible duplicate', 'info', `Looks like <b>${esc(y.id)}: ${esc(y.title)}</b> (${esc(y.stage)}${y.e ? ', due ' + fmt(y.e) : ''}).<span class="row" style="margin-top:6px"><button class="btn ghost" data-open="${esc(y.id)}">Open ${esc(y.id)}</button><button class="btn ghost" data-act="dismiss-dup" data-id="${esc(i.id)}">Dismiss this one</button></span>`]); });
  if (i.open && !i.est) out.push(['No estimate', 'info', 'Set a Type or Override days in the Planner so this counts toward capacity.']);
  return out;
}

function glance(i, d) {
  const T = d.TODAY;
  const now = wbsNow(i, T);
  const nextMs = i.wbs ? i.wbs.find(x => x.kind === 'milestone' && x.s >= T) : null;
  const last = (i.replies && i.replies.length) ? i.replies[i.replies.length - 1] : i.lastReply || null;
  const lastD = last && last.at ? new Date(last.at) : null;
  const tiles = [
    ['Now', now ? (now.s <= T ? esc(now.label) : 'Next: ' + esc(now.label)) : esc(i.stage), now ? (now.kind === 'milestone' || +now.s === +now.e ? dayLabel(now.s) : 'through ' + fmt(now.e)) : (i.e ? 'Due ' + dayLabel(i.e) : 'No due date')],
    ['Next milestone', nextMs ? esc(nextMs.label) : (i.e ? 'Due date' : '—'), nextMs ? dayLabel(nextMs.s) : (i.e ? dayLabel(i.e) : '')],
    ['Latest reply', last ? esc(last.by) : 'No replies yet', last ? (lastD ? whenLabel(last.at, T) + ' · ' : '') + esc(String(last.text || '').replace(/\s+/g, ' ').slice(0, 70)) : ''],
    ['Days', i.est ? i.est.toFixed(1) + ' d' : 'No estimate', i.team.length ? i.team.map(n => n.split(' ')[0] + ' ' + (i.est ? daysFor(i, n).toFixed(1) : '')).join(' · ') : 'Nobody yet']
  ];
  return `<div class="glance">${tiles.map(([k, v, s2]) => `<div class="gt"><span class="k">${k}</span><span class="v">${v}</span><span class="sub">${s2}</span></div>`).join('')}</div>`;
}

// The work back schedule as a mini timeline: bars for work, diamonds for milestones, today marked
function scheduleSvg(i, d) {
  const T = d.TODAY;
  const steps = i.wbs || [];
  const a0 = steps.reduce((m, x) => minD(m, x.s), steps[0].s), b0 = steps.reduce((m, x) => maxD(m, x.e), steps[0].e);
  const a = minD(a0, i.dueBC || a0), b = maxD(b0, i.dueBC || b0);
  const span = Math.max(1, Math.round((b - a) / 864e5) + 1);
  const W = 640, L = 190, R = 16, rowH = 26, top = 24, H = top + steps.length * rowH + 8;
  const x = dt => L + (W - L - R) * (Math.round((dt - a) / 864e5) / span);
  const c = CLIENT[i.client][0];
  const ticks = []; for (let k = 0; k <= span; k += Math.max(1, Math.ceil(span / 6))) ticks.push(add(a, k));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Work back schedule" style="width:100%;height:auto;display:block">
    ${ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${H}" stroke="#EEF0F3"/><text x="${x(t)}" y="12" font-size="10" fill="#5F6775" text-anchor="middle">${fmt(t)}</text>`).join('')}
    ${T >= a && T <= b ? `<line x1="${x(T) + 2}" x2="${x(T) + 2}" y1="${top - 8}" y2="${H}" stroke="#6100DB" stroke-width="2" opacity=".6"/>` : ''}
    ${i.dueBC ? `<line x1="${x(i.dueBC) + 4}" x2="${x(i.dueBC) + 4}" y1="${top - 8}" y2="${H}" stroke="#B45309" stroke-dasharray="3 3"/>` : ''}
    ${steps.map((st, k) => { const y = top + k * rowH, done = st.e < T, col = done ? '#CBD5E1' : c;
      const lab = `<text x="0" y="${y + 15}" font-size="12" fill="${done ? '#5F6775' : '#242624'}" font-weight="${st.s <= T && st.e >= T ? 800 : 500}">${esc(st.label.length > 28 ? st.label.slice(0, 27) + '…' : st.label)}</text>`;
      if (st.kind === 'work') return lab + `<rect x="${x(st.s)}" y="${y + 5}" width="${Math.max(6, x(add(st.e, 1)) - x(st.s) - 2)}" height="14" rx="4" fill="${col}"><title>${esc(st.label)}: ${fmt(st.s)}–${fmt(st.e)}</title></rect>`;
      const cx = x(st.s) + 4; return lab + `<rect x="${cx - 6}" y="${y + 6}" width="12" height="12" fill="${col}" transform="rotate(45 ${cx} ${y + 12})"><title>${esc(st.label)}: ${dayLabel(st.s)}</title></rect>`; }).join('')}
  </svg><div class="legend" style="margin-top:4px"><span><span class="sw" style="background:${c}"></span>Work</span><span><span class="sw" style="background:${c};transform:rotate(45deg) scale(.8)"></span>Milestone</span><span><span class="sw" style="background:#6100DB;width:3px"></span>Today</span>${i.dueBC ? '<span><span class="sw" style="border-left:2px dashed #B45309;width:0"></span>Basecamp due date</span>' : ''}</div>`;
}

function splitBar(i, d) {
  if (!i.est || !i.team.length) return '<div class="sub">No days to split yet. Set an estimate first.</div>';
  return `<div class="sbar">${i.team.filter(n => daysFor(i, n) > 0).map(n => { const v = daysFor(i, n); return `<span style="flex:${v};background:${personColor(d, n)}" title="${esc(n)}: ${v.toFixed(2)} d">${v / i.est > 0.12 ? esc(n.split(' ')[0]) + ' ' + v.toFixed(1) : ''}</span>`; }).join('')}</div>
    <div class="legend">${i.team.map(n => `<span><span class="sw" style="background:${personColor(d, n)}"></span>${esc(n)} · ${i.roleOf(n)} · ${daysFor(i, n).toFixed(2).replace(/\.?0+$/, '')} d${winOf(i, n) !== 'all' ? ' · ' + WIN_LABEL[winOf(i, n)] : ''}${i.owns && i.owns[n] ? ' · owns ' + esc(i.owns[n]) : ''}</span>`).join('')}</div>
    ${i.ovDays ? `<div class="sub">${i.est.toFixed(1)} d in all: ${i.handsEst.toFixed(1)} d hands-on + ${i.ovDays.toFixed(1)} d oversight (${Math.round(i.ovPct * 100)}%${i.ovCustom ? ', set for this deliverable' : ''}).</div>` : ''}`;
}

function conversation(i, d) {
  const notes = d.notes.filter(n => n.id === i.id).map(n => ({ kind: 'note', who: n.author, when: n.at, text: n.text, sort: '' }));
  const reps = (i.replies || []).map(x => ({ kind: x.ext && x.ext.length ? 'ext' : 'reply', who: x.by, when: x.d ? whenLabel(x.at, d.TODAY) : '', text: x.text, url: x.url, sort: x.at || '' }));
  const loading = i.lite && !i.full;
  return `<div class="notes"><label class="f">Add a team note<textarea class="nt" id="noteText" placeholder="Status update, blocker, handover detail…"></textarea></label>
      <button class="btn ghost" data-note="${esc(i.id)}" style="align-self:flex-start">Add note</button></div>
    ${loading ? '<div class="sub">Loading Basecamp replies…</div>' : ''}
    <div class="replies" style="max-height:none">${reps.slice().reverse().concat(notes.slice().reverse()).map(x => `<div class="reply${x.kind === 'ext' ? ' ext' : ''}${x.kind === 'note' ? ' tnote' : ''}"><div class="h">${esc(x.who)} <span class="sub">· ${esc(x.when)}</span> <span class="stat ${x.kind === 'note' ? 'off' : x.kind === 'ext' ? 'ok' : 'off'}" style="padding:1px 8px">${x.kind === 'note' ? 'Team note' : x.kind === 'ext' ? 'Sent to client' : 'Basecamp'}</span>${x.url ? ` <a class="sub" href="${esc(x.url)}" target="_blank" rel="noopener">Open</a>` : ''}</div><div class="b">${esc(x.text)}</div></div>`).join('') || (loading ? '' : '<div class="empty">No replies or notes yet.</div>')}</div>`;
}

function overviewPane(i, d) {
  const loading = i.lite && !i.full;
  return `<div class="grid2">
      <label class="f">Stage<select data-stage="${esc(i.id)}">${d.lists.stages.map(s => `<option ${s === i.stage ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
      <label class="f">Booking<select data-booking="${esc(i.id)}">${['Confirmed', 'Tentative'].map(s => `<option ${s === i.booking ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
    <div class="clientrow">
      <label class="f" style="flex:1;min-width:0">Client${!i.account || i.account === 'Other' ? ' <span class="sub" style="color:#92400E">not set</span>' : ''}<input id="clientIn" list="acctList" value="${esc(i.account && i.account !== 'Other' ? i.account : '')}" placeholder="Pick or type a client"><datalist id="acctList">${d.lists.accounts.filter(a => a !== 'Other').map(a => `<option value="${esc(a)}">`).join('')}</datalist></label>
      <button class="btn ghost" data-act="save-client" data-id="${esc(i.id)}">Save</button>
    </div>
    ${i.project ? `<label class="sub" style="display:flex;gap:6px;align-items:center;margin-top:-6px"><input type="checkbox" id="clientAll" checked style="accent-color:var(--accent)"> Use for every to-do from the Basecamp project "${esc(i.project)}", now and later</label>` : ''}
    <dl class="facts">
      <dt>Lead</dt><dd>${esc(i.lead || '—')}${i.owner && i.owner !== i.lead ? ' <span class="sub">(Owner: ' + esc(i.owner) + ')</span>' : ''}</dd>
      <dt>Due</dt><dd>${(i.dueBC || (!i.wbs && i.e)) ? dayLabel(i.dueBC || i.e) + (i.wbs ? ' <span class="sub">Basecamp</span>' : '') : (i.wbs ? 'Not set in Basecamp' : '—')}
        ${i.e ? `<button class="pill ${i.clientDate ? 'on' : ''}" style="margin-left:6px" data-act="client-date" data-id="${esc(i.id)}" aria-pressed="${i.clientDate ? 'true' : 'false'}" title="A due date promised to the client">${I.lock} ${i.clientDate ? 'Client date' : 'Mark as client date'}</button>` : ''}</dd>
      <dt>Type</dt><dd>${esc(i.type || '—')}${i.est ? ' · ' + i.est.toFixed(1) + ' d' : ''}</dd>
      <dt>In Basecamp</dt><dd>${esc(i.assigned || '—')}</dd>
      ${i.notes ? `<dt>Planner notes</dt><dd>${esc(i.notes)}</dd>` : ''}</dl>
    ${i.stage === 'Delivered' ? `<div class="callout info"><div class="row between"><b>Actual days</b><span class="sub">Estimate ${i.est ? i.est.toFixed(1) + ' d' : 'not set'}</span></div><div class="row" style="margin-top:6px"><input type="number" min="0" step="0.25" id="actualDays" value="${i.actual != null ? i.actual : ''}" placeholder="${i.est ? i.est.toFixed(1) : '0'}" class="sel" style="width:96px"><button class="btn ghost" data-act="save-actual" data-id="${esc(i.id)}">Save</button></div></div>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Project brief</span>
      <div class="brief ${i.brief ? '' : 'none'}">${loading ? 'Loading the brief…' : i.brief ? esc(i.brief) : 'No brief yet. It fills in from the to-do description on the next sync.'}</div></div>`;
}

function schedulePane(i, d) {
  if (!i.wbs) return `<div class="callout info">No work back schedule yet. Add a <b>WBS:</b> heading to the Basecamp to-do (or post one in a reply) with lines like <code>Report Development: Oct 19-23</code>, and the phases show here and on the timeline.</div>
    ${i.s && i.e ? `<div class="sub">Planned from ${dayLabel(i.s)} to ${dayLabel(i.e)}${i.est ? ', spread evenly over ' + wd(i.s, i.e) + ' working days' : ''}.</div>` : ''}`;
  return `<div class="row between"><span class="lbl">Work back schedule (${esc(i.wbsFrom)})</span><span class="sub">${i.wbsWork ? 'Effort lands on the work phases only' : 'Add an estimate to spread effort over the phases'}</span></div>
    ${scheduleSvg(i, d)}
    <details><summary class="sub" style="cursor:pointer">Show as a list</summary>${wbsBlock(i, d.TODAY)}</details>`;
}

function peoplePane(i, d) {
  const ovPeople = d.people.filter(p => p.projectRole === 'Oversight');
  const accOv = (d.accountOv || {})[i.account];
  const dflt = accOv !== undefined ? accOv : (d.ovDefault !== undefined ? d.ovDefault : 0.25);
  const ovOpts = [['', 'Default for ' + (i.account || 'this account') + ' (' + Math.round(dflt * 100) + '%)'], ['0', 'None'], ['0.05', '5%'], ['0.1', '10%'], ['0.25', '25%']];
  const ovSel = i.ovCustom ? String(i.ovPct) : '';
  const ovOn = i.overs && i.overs.length;
  return `<div class="row between"><span class="lbl">Days per person</span><span class="stat ${i.hasSplit ? 'ok' : i.needsSplit ? 'warn' : 'off'}">${i.hasSplit ? 'Custom split' : i.needsSplit ? 'Split not set · even for now' : 'Default'}</span></div>
    ${splitBar(i, d)}
    <details ${i.hasSplit || i.needsSplit ? 'open' : ''}><summary class="sub" style="cursor:pointer">Change the split</summary>
      <div class="sub" style="margin-top:6px">Hands-on days for each person, and when they work on it. Oversight is added on top.</div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${d.people.filter(p => p.projectRole !== 'Oversight' && (!(p.lastD && p.lastD < d.TODAY) || i.team.indexOf(p.name) !== -1)).map(p => {
        const on = i.team.indexOf(p.name) !== -1 && i.overs.indexOf(p.name) === -1, v = on && i.handsEst ? Math.round(daysFor(i, p.name) * 100) / 100 : '';
        const w = on ? winOf(i, p.name) : 'all';
        return `<div class="sp ${on ? 'on' : ''}" style="display:grid;grid-template-columns:minmax(110px,1fr) 72px minmax(178px,1.1fr) minmax(130px,1.3fr);gap:8px;align-items:center">
          <span><b>${esc(p.name)}</b>${on ? ' <span class="sub">' + i.roleOf(p.name) + '</span>' : ''}</span>
          <input type="number" min="0" step="0.25" inputmode="decimal" data-split-name="${esc(p.name)}" value="${v}" placeholder="0" aria-label="Days for ${esc(p.name)}">
          <select class="sel" data-split-win="${esc(p.name)}" aria-label="When ${esc(p.name)} works on it">${[['all', 'Whole project'], ['dev', 'Development'], ['rev', 'Review and revisions']].map(o => `<option value="${o[0]}" ${o[0] === w ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
          <input type="text" class="sel" style="width:auto;text-align:left" data-split-owns="${esc(p.name)}" value="${esc((i.owns || {})[p.name] || '')}" placeholder="Owns (optional)" aria-label="What ${esc(p.name)} owns">
        </div>`;
      }).join('')}
      ${ovPeople.length ? `<div class="sp" style="display:grid;grid-template-columns:minmax(110px,1fr) minmax(200px,2fr);gap:8px;align-items:center;background:#FAFAFC;border-style:dashed">
          <span><b>${ovPeople.map(p => esc(p.name)).join(', ')} · oversight</b><br><span class="sub">${ovOn ? (i.ovDays ? i.ovDays.toFixed(1) + ' d on top of ' + i.handsEst.toFixed(1) + ' d' : 'No days yet') : 'Counts once ' + esc(ovPeople[0].name) + ' is on it in Basecamp'}</span></span>
          <select class="sel" data-split-ov="1" aria-label="Oversight share">${ovOpts.map(o => `<option value="${o[0]}" ${o[0] === ovSel ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>
        </div>` : ''}</div>
      <div class="row" style="margin-top:8px"><button class="btn ghost" data-act="save-split" data-id="${esc(i.id)}">Save split</button>${i.hasSplit || i.ovCustom ? `<button class="btn ghost" data-act="reset-split" data-id="${esc(i.id)}">Use default split</button>` : ''}<span class="sub" id="splitTotal">Hands-on ${i.handsEst ? i.handsEst.toFixed(2).replace(/\.?0+$/, '') : 0} d</span></div>
    </details>`;
}

function cardHtml(i, d, full) {
  const t = timingOf(i, d.TODAY);
  const alerts = cardAlerts(i, d);
  const convN = (i.replies ? i.replies.length : (i.replyCount || 0)) + d.notes.filter(n => n.id === i.id).length;
  const tab = S.dtab || 'overview';
  const head = `<div class="chead">
      <div class="row between" style="flex-wrap:nowrap;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
          <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:${CLIENT[i.client][0]}">${esc(i.client)}${i.sub ? ' · ' + esc(i.sub) : ''} · ${esc(i.id)}</span>
          <h2 style="font-size:${full ? 26 : 20}px;line-height:1.25;color:var(--ink);text-transform:none;letter-spacing:0">${esc(i.title)}</h2>
          <div class="row"><span class="chip" style="${CHIP[t] || 'background:#F3F4F6;color:#4B5563'}">${esc(t)}</span><span class="chip" style="background:#F2E4FF;color:#6100DB">${esc(i.stage)}</span><span class="chip" style="background:#F3F4F6;color:#374151">${esc(i.priority)} priority</span>${i.tent ? '<span class="chip" style="background:#F3F4F6;color:#374151">Tentative</span>' : ''}
            <span style="display:flex;padding-left:8px">${i.team.map(n => `<span class="av mini" title="${esc(n)} (${i.roleOf(n)})" style="background:${personColor(d, n)};color:#fff">${esc(initials(n))}</span>`).join('')}</span></div>
        </div>
        <div class="row" style="flex-wrap:nowrap">
          <button class="x" aria-label="${full ? 'Collapse to side panel' : 'Expand to full page'}" title="${full ? 'Collapse' : 'Expand'}" data-act="expand">${full ? '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>' : '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>'}</button>
          <button class="x" aria-label="Close" data-close="1">${I.close}</button></div>
      </div>
      ${i.link ? `<a class="btn primary" style="align-self:flex-start;min-height:38px" href="${esc(i.link)}" target="_blank" rel="noopener">${I.ext} Open in Basecamp</a>` : ''}
    </div>`;
  const alertHtml = alerts.length ? `<details class="alerts" ${alerts.some(a => a[0] === 'Hand-over needed' || a[0] === 'Schedule changed' || a[0] === 'Due date moved') ? 'open' : ''}><summary><span class="dot warn"></span><b>${alerts.length} ${alerts.length === 1 ? 'thing needs' : 'things need'} attention</b> <span class="sub">${alerts.map(a => a[0]).join(' · ')}</span></summary>
      ${alerts.map(([l, k, h]) => `<div class="callout ${k}"><b>${esc(l)}.</b> ${h}</div>`).join('')}</details>` : '';
  if (full) {
    return `${head}${glance(i, d)}${alertHtml}
      <div class="cgrid"><div class="ccol">
        <section class="psec"><h3>Brief and details</h3>${overviewPane(i, d)}</section>
        <section class="psec"><h3>Conversation <span class="count">${convN}</span></h3>${conversation(i, d)}</section></div>
      <div class="ccol">
        <section class="psec"><h3>Schedule</h3>${schedulePane(i, d)}</section>
        <section class="psec"><h3>People and days</h3>${peoplePane(i, d)}</section></div></div>`;
  }
  const tabs = [['overview', 'Overview', ''], ['schedule', 'Schedule', i.wbs ? i.wbs.length : ''], ['conversation', 'Conversation', convN || ''], ['people', 'People & days', i.team.length || '']];
  const pane = tab === 'schedule' ? schedulePane(i, d) : tab === 'conversation' ? conversation(i, d) : tab === 'people' ? peoplePane(i, d) : overviewPane(i, d);
  return `${head}${glance(i, d)}${alertHtml}
    <div class="tabs dtabs" role="tablist">${tabs.map(([k, l, c]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-dtab="${k}">${l}${c !== '' ? `<span class="count">${c}</span>` : ''}</button>`).join('')}</div>
    <div class="dpane">${pane}</div>`;
}

function renderLayer() {
  const L = document.getElementById('layer');
  const d = S.data;
  if (S.detail) {
    const i = d.items.find(x => x.id === S.detail);
    if (!i) { S.detail = null; L.innerHTML = ''; return; }
    if (i.lite && !i.full && !i.loading) loadCard(i);
    const body = cardHtml(i, d, S.expanded);
    L.innerHTML = S.expanded
      ? `<div class="overlay page-ov"><div class="cpage" role="dialog" aria-modal="true" aria-label="${esc(i.title)}">${body}</div></div>`
      : `<div class="overlay"><button class="scrim" aria-label="Close details" data-close="1"></button><div class="drawer card2" role="dialog" aria-modal="true" aria-label="${esc(i.title)}">${body}</div></div>`;
    return;
  }
  if (S.askActual) {
    const i = d.items.find(x => x.id === S.askActual);
    if (i) {
      L.innerHTML = `<div class="overlay" style="justify-content:center;align-items:center"><button class="scrim" aria-label="Close" data-close="1"></button>
        <div class="modal" role="dialog" aria-modal="true" aria-label="Actual days">
          <div class="row between"><h2>Delivered</h2><button type="button" class="x" aria-label="Close" data-close="1">${I.close}</button></div>
          <p style="margin:0;line-height:1.5"><b>${esc(i.title)}</b><br><span class="sub">How many days did it take in total, across everyone? The estimate was ${i.est ? i.est.toFixed(1) + ' days' : 'not set'}.</span></p>
          <label class="f">Actual days<input type="number" min="0" step="0.25" id="actualDays" value="${i.est ? i.est : ''}"></label>
          <div class="row"><button class="btn primary" data-act="save-actual" data-id="${esc(i.id)}">Save</button><button class="btn ghost" data-close="1">Skip</button></div>
        </div></div>`;
      return;
    }
  }
  if (S.bulk) {
    const T = d.TODAY;
    const groups = [
      ['Needs triage', d.items.filter(i => i.stage === 'Needs triage')],
      ['Past due', d.items.filter(i => i.open && i.e && i.e < T)],
      ["Basecamp can't find these links", d.items.filter(i => ['Delivered', 'Dismissed'].indexOf(i.stage) === -1 && /Basecamp can't show this link/.test(i.notes))]
    ];
    const seen = {};
    L.innerHTML = `<div class="overlay" style="justify-content:center;align-items:center"><button class="scrim" aria-label="Close" data-close="1"></button>
      <div class="modal" role="dialog" aria-modal="true" aria-label="Clean up in bulk" style="width:760px">
        <div class="row between"><h2>Clean up in bulk</h2><button type="button" class="x" aria-label="Close" data-close="1">${I.close}</button></div>
        <span class="sub">Tick the rows to change, then pick a stage. Dismissed rows stay out of the planner and never come back from the sync.</span>
        ${groups.map(([g, list]) => { const fresh = list.filter(i => !seen[i.id] && (seen[i.id] = 1)); return fresh.length ? `<div class="bgrp"><label class="row" style="font-weight:800"><input type="checkbox" data-bulk-all="${esc(g)}"> ${esc(g)} (${fresh.length})</label>
          ${fresh.map(i => `<label class="brow"><input type="checkbox" data-bulk-id="${esc(i.id)}" data-bulk-grp="${esc(g)}"><span class="main"><span>${esc(i.title)}</span><span class="sub">${esc(i.id)} · ${esc(i.client)} · ${esc(i.stage)}${i.e ? ' · due ' + fmt(i.e) + (i.e.getFullYear() !== T.getFullYear() ? ' ' + i.e.getFullYear() : '') : ''}</span></span></label>`).join('')}</div>` : ''; }).join('') || '<div class="empty">Nothing to clean up.</div>'}
        <div class="row" style="position:sticky;bottom:-24px;background:#fff;padding:12px 0"><span class="sub" id="bulkCount">0 selected</span>
          <button class="btn ghost" data-act="bulk-apply" data-stage="Delivered">Mark Delivered</button>
          <button class="btn ghost" data-act="bulk-apply" data-stage="Dismissed">Dismiss</button>
          <button class="btn ghost" data-act="bulk-apply" data-stage="Not started">Move to Not started</button></div>
      </div></div>`;
    return;
  }
  if (S.feedback) {

      </form></div>`;
    return;
  }
  if (S.welcome && d) {
    const conn = (d.sync && d.sync.conns || []).find(c => c.me);
    L.innerHTML = `<div class="overlay" style="justify-content:center;align-items:center"><button class="scrim" aria-label="Close" data-act="welcome-done"></button>
      <div class="modal welcome" style="width:680px">
        <div class="row between"><span class="row" style="gap:12px;flex-wrap:nowrap"><svg class="appicon" style="width:44px;height:44px" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#242624"/><rect x="92" y="120" width="196" height="56" rx="28" fill="#6100DB"/><rect x="172" y="228" width="248" height="56" rx="28" fill="#B98AF5"/><rect x="92" y="336" width="148" height="56" rx="28" fill="#FFFFFF"/><rect x="270" y="341" width="145" height="46" rx="23" fill="none" stroke="#B98AF5" stroke-width="10" stroke-dasharray="20 14"/><rect x="312" y="88" width="10" height="336" rx="5" fill="#F2E4FF"/></svg><h2>Welcome to the Insights planner</h2></span><span class="stat warn">Beta</span></div>
        <p style="margin:0;line-height:1.55">One place to see the Insights team's work: what's due, who's busy, who's out and what's coming. It fills itself from everyone's Basecamp, so most days you only look and update stages.</p>
        <div class="wsteps">
          <div class="wstep"><span class="sub">Step 1</span><b>Connect your Basecamp</b><span class="sub">Once, so your to-dos come in.${conn && conn.status === 'connected' ? ' <b style="color:#047857">Done.</b>' : ''}</span>${conn && conn.status === 'connected' ? '' : '<button class="btn ghost" data-act="welcome-go" data-to="settings">Go to Settings</button>'}</div>
          <div class="wstep"><span class="sub">Step 2</span><b>Check My work</b><span class="sub">Pick your name to see your week and what's next.</span><button class="btn ghost" data-act="welcome-go" data-to="mine">Open My work</button></div>
          <div class="wstep"><span class="sub">Step 3</span><b>Log time off</b><span class="sub">PTO, sick days and half days keep capacity honest.</span><button class="btn ghost" data-act="welcome-go" data-to="timeoff">Log time off</button></div>
        </div>
        <div class="callout info" style="margin:0">It's a beta: numbers are estimates and only as good as the stages and estimates we keep. Move work to Internal review when it gets there, and use <b>Feedback</b> (top right) when something looks wrong. Questions while Tom is out go to Tayler.</div>
        <div class="row"><button class="btn primary" data-act="welcome-done">Got it</button><button class="btn ghost" data-act="welcome-go" data-to="faq">Read the FAQ</button></div>
      </div></div>`;
    return;
  }
  if (S.timeoff) {
    const tf = S.timeoff, f = tf.f, T = d.TODAY;
    const opt = (arr, v, blank) => (blank ? '<option value=""></option>' : '') + arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
    const names = d.team.filter(p => p.include && !(p.last && P(p.last) < T)).map(p => p.name);
    const list = d.timeOff.filter(o => o.id && P(o.end) >= T).sort((a, b) => a.start < b.start ? -1 : 1);
    const when = o => { const s = P(o.start), e = P(o.end); return o.half ? DOW[s.getDay()] + ', ' + fmt(s) + ' · ' + (o.part || 'PM') + ' half day' : +s === +e ? DOW[s.getDay()] + ', ' + fmt(s) : fmt(s) + ' – ' + fmt(e) + ' · ' + wd(s, e) + ' working day' + (wd(s, e) === 1 ? '' : 's'); };
    L.innerHTML = `<div class="overlay" style="justify-content:center;align-items:center"><button class="scrim" aria-label="Close" data-close="1"></button>
      <div class="modal" style="width:620px">
        <div class="row between"><h2>${tf.edit ? 'Edit time off' : 'Log time off'}</h2><button type="button" class="x" aria-label="Close" data-close="1">${I.close}</button></div>
        <form id="toForm" style="display:flex;flex-direction:column;gap:12px">
          <div class="grid2">
            <label class="f">Who<select name="name">${opt(names, f.name || d.meTeam, true)}</select></label>
            <label class="f">Type<select name="type">${opt(['PTO', 'Sick', 'OOO', 'Leave', 'Other'], f.type || 'PTO')}</select></label>
            <label class="f">Start<input type="date" name="start" value="${esc(f.start || '')}" required></label>
            <label class="f">End<input type="date" name="end" value="${esc(f.end || '')}"></label>
            <label class="f">Day<select name="day">${opt(['Full day', 'Half day (AM)', 'Half day (PM)'], f.half ? 'Half day (' + (f.part || 'PM') + ')' : 'Full day')}</select></label>
            <label class="f">Covering<select name="cover">${opt(names, f.cover || '', true)}</select></label>
          </div>
          <span class="sub" style="margin-top:-4px">Leave End blank for a single day. Covering and Note are optional.</span>
          <label class="f">Note<input name="note" value="${esc(f.note || '')}" placeholder="e.g. Back online Monday morning"></label>
          <div class="row"><button class="btn primary" type="submit">${tf.edit ? 'Save changes' : 'Add time off'}</button>${tf.edit ? '<button type="button" class="btn ghost" data-act="to-new">Cancel edit</button>' : ''}<span id="toMsg" class="sub"></span></div>
        </form>
        <div style="border-top:1px solid var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:6px">
          <div class="row between"><h3>Current and upcoming</h3><span class="sub">${d.summerFridays ? 'Summer Fridays are counted automatically' : ''}</span></div>
          ${list.length ? list.map(o => `<div class="li"><span class="chip" style="background:#FEF3C7;color:#92400E">${esc(o.type)}</span><span class="main"><span>${esc(o.name)}</span><span class="sub">${esc(when(o))}${coverFrom(o.note, d.team, o.name) ? ' · ' + esc(coverFrom(o.note, d.team, o.name)) + ' covering' : ''}</span></span>
            <span class="row" style="gap:4px;flex-wrap:nowrap"><button class="pill" data-act="to-edit" data-id="${esc(o.id)}">Edit</button><button class="pill" data-act="to-del" data-id="${esc(o.id)}">${S.confirm === 'to-' + o.id ? 'Click to delete' : 'Delete'}</button></span></div>`).join('') : '<div class="empty">No time off logged.</div>'}
          <span class="sub">Saved to the Time off tab in the Sheet. Company holidays are on the Team tab.</span>
        </div>
      </div></div>`;
    return;
  }
  if (S.adding) {
    const opt = arr => '<option value=""></option>' + arr.map(v => `<option>${esc(v)}</option>`).join('');
    L.innerHTML = `<div class="overlay" style="justify-content:center;align-items:center"><button class="scrim" aria-label="Close" data-close="1"></button>
      <form class="modal" id="addForm">
        <div class="row between"><h2>Add deliverable</h2><button type="button" class="x" aria-label="Close" data-close="1">${I.close}</button></div>
        <label class="f">Basecamp link<input name="link" placeholder="https://3.basecamp.com/4104244/buckets/.../todos/..."></label>
        <span class="sub" style="margin-top:-6px">Optional. Title, assignees, dates and the brief are pulled from Basecamp.</span>
        <label class="f">Deliverable<input name="deliverable" placeholder="Leave blank to use the Basecamp title"></label>
        <div class="grid2">
          <label class="f">Account<select name="account">${opt(d.lists.accounts)}</select></label>
          <label class="f">Owner<select name="owner">${opt(d.team.map(p => p.name))}</select></label>
          <label class="f">Type<select name="type">${opt(d.lists.types)}</select></label>
          <label class="f">Scale<select name="scale">${opt(d.lists.scales)}</select></label>
          <label class="f">Start date<input type="date" name="start"></label>
          <label class="f">Due date<input type="date" name="due"></label>
        </div>
        <div id="addMsg" class="sub"></div>
        <button class="btn primary" type="submit" style="justify-content:center">Add to planner</button>
      </form></div>`;
    return;
  }
  L.innerHTML = '';
}

/* ===== Events ===== */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function save(fn, id, field, value, label) {
  const item = S.data.items.find(x => x.id === id); if (!item) return;
  const before = item[field];
  item[field] = value;
  if (field === 'stage') item.open = OPEN_EXCLUDE.indexOf(value) === -1;
  if (field === 'booking') item.tent = value === 'Tentative';
  render();
  google.script.run
    .withSuccessHandler(() => { toast(label); if (fn === 'setStage' && value === 'Delivered' && !S.detail && item.actual == null) { S.askActual = id; renderLayer(); } })
    .withFailureHandler(err => { item[field] = before; if (field === 'stage') item.open = OPEN_EXCLUDE.indexOf(before) === -1; if (field === 'booking') item.tent = before === 'Tentative'; render(); toast('Could not save: ' + err.message); })
    [fn](item.row, id, value);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-h],[data-owner],[data-open],[data-close],[data-act],[data-confirm],[data-triage],[data-note],[data-afilter],[data-dtab],[data-pick],[data-bset],[data-rail],[data-bkadd]');
  if (!el) return;
  if (el.tagName === 'A' && el.dataset.tab) e.preventDefault();
  if (el.dataset.tab) { if (el.dataset.tab === 'activity' && S.tab !== 'activity') { S.prevSeen = seenAt(); } S.tab = el.dataset.tab; if (S.tab === 'activity') { const top = S.data.activity[0]; S.actSeen = top ? top.at : S.actSeen; } render(); }
  else if (el.dataset.h) { S.horizon = el.dataset.h; render(); }
  else if (el.dataset.owner) { S.owner = el.dataset.owner; render(); }
  else if (el.dataset.afilter) { S.actFilter = el.dataset.afilter; render(); }
  else if (el.dataset.dtab) { S.dtab = el.dataset.dtab; renderLayer(); }
  else if (el.dataset.act === 'connect') {
    // Open the tab now (so it isn't blocked), then point it at a freshly made sign-in link
    const w = window.open('', '_blank'), msg = document.getElementById('connMsg');
    if (w) w.document.write('<p style="font-family:Arial;padding:16px">Opening Basecamp…</p>');
    if (msg) msg.textContent = 'Getting a fresh sign-in link…';
    google.script.run
      .withSuccessHandler(u => {
        S.awaiting = true;
        if (w && !w.closed) { w.location.href = u; if (msg) msg.textContent = ''; }
        else if (msg) msg.innerHTML = `Your browser blocked the new tab. <a href="${esc(u)}" target="_blank" rel="noopener">Open Basecamp sign-in</a> (works for the next few minutes).`;
      })
      .withFailureHandler(err => { if (w) w.close(); if (msg) msg.textContent = 'Could not start the connection: ' + err.message; })
      .getConnectUrl();
  }
  else if (el.dataset.act === 'book-open') { S.book.open = true; render(); setTimeout(() => { const t = document.getElementById('bk_title'); if (t) t.focus(); }, 30); }
  else if (el.dataset.act === 'book-cancel') { S.book = { open: false, f: { likelihood: 'Likely', people: [] } }; render(); }
  else if (el.dataset.bkadd) { const f = S.book.f, n = el.dataset.bkadd; f.people = f.people || []; const k = f.people.indexOf(n); if (k === -1) f.people.push(n); else f.people.splice(k, 1); render(); }
  else if (el.dataset.act === 'book-submit') {
    const f = S.book.f, msg = document.getElementById('bkMsg');
    if (!f.title || !f.due) { if (msg) msg.textContent = 'Add a name and a due date.'; return; }
    el.disabled = true; if (msg) msg.textContent = 'Booking…';
    google.script.run
      .withSuccessHandler(r => { S.book = { open: false, f: { likelihood: 'Likely', people: [] } }; toast('Booked ' + ((r && r.id) || '') + ' as Tentative'); load(); })
      .withFailureHandler(err => { el.disabled = false; if (msg) msg.textContent = err.message; })
      .bookWork(f);
  }
  else if (el.dataset.act === 'plan-assign' || el.dataset.act === 'plan-move') { const m = el.dataset.act === 'plan-assign' ? 'assign' : 'move'; S.planEdit = S.planEdit && S.planEdit.id === el.dataset.id && S.planEdit.mode === m ? null : { id: el.dataset.id, mode: m }; render(); }
  else if (el.dataset.act === 'plan-save') {
    const item = S.data.items.find(x => x.id === el.dataset.id); if (!item) return;
    const f = {};
    if (S.planEdit.mode === 'assign') f.people = [...document.querySelectorAll('[data-pa]:checked')].map(x => x.dataset.pa);
    else { f.start = (document.getElementById('pm_start') || {}).value || ''; f.due = (document.getElementById('pm_due') || {}).value; if (!f.due) { toast('Add a due date'); return; } }
    el.disabled = true;
    google.script.run.withSuccessHandler(() => { S.planEdit = null; toast('Saved'); load(); }).withFailureHandler(err => { el.disabled = false; toast('Could not save: ' + err.message); }).setPlanFields(item.row, item.id, f);
  }
  else if (el.dataset.act === 'plan-drop') {
    const k = 'drop-' + el.dataset.id;
    if (S.confirm !== k) { S.confirm = k; render(); setTimeout(() => { if (S.confirm === k) { S.confirm = null; render(); } }, 4000); return; }
    S.confirm = null; save('setStage', el.dataset.id, 'stage', 'Dismissed', 'Dropped');
  }
  else if (el.dataset.act === 'next-stage') { save('setStage', el.dataset.id, 'stage', el.dataset.stage, 'Moved to ' + el.dataset.stage); }
  else if (el.dataset.act === 'quick-note') { S.detail = el.dataset.id; S.dtab = 'conversation'; renderLayer(); setTimeout(() => { const t = document.getElementById('noteText'); if (t) t.focus(); }, 30); }
  else if (el.dataset.act === 'expand') { S.expanded = !S.expanded; renderLayer(); }
  else if (el.dataset.bset) { S[el.dataset.bset] = el.dataset.v; render(); }
  else if (el.dataset.rail && !S.dragId) { S.boardOpen[el.dataset.rail] = !S.boardOpen[el.dataset.rail]; render(); }
  else if (el.dataset.act === 'b-older') { S.bOlder = !S.bOlder; render(); }
  else if (el.dataset.act === 'b-compact') { S.compact = !S.compact; try { localStorage.setItem('kh_compact', S.compact ? '1' : ''); } catch (e) {} render(); }
  else if (el.dataset.triage) { S.showTriage = !S.showTriage; render(); }
  else if (el.dataset.note) {
    const box = document.getElementById('noteText'); const text = box ? box.value.trim() : '';
    if (!text) { toast('Write a note first'); return; }
    el.disabled = true;
    google.script.run
      .withSuccessHandler(n => { S.data.notes.push(n); renderLayer(); render(); toast('Note added'); })
      .withFailureHandler(err => { el.disabled = false; toast('Could not add note: ' + err.message); })
      .addNote(el.dataset.note, text);
  }
  else if (el.dataset.confirm) { save('setBooking', el.dataset.confirm, 'booking', 'Confirmed', 'Booking confirmed'); }
  else if (el.dataset.close) { S.detail = null; S.expanded = false; S.adding = false; S.bulk = false; S.askActual = null; S.timeoff = null; S.feedback = null; renderLayer(); }
  else if (el.dataset.act === 'bulk') { S.bulk = true; renderLayer(); }
  else if (el.dataset.act === 'bulk-apply') {
    const ids = [...document.querySelectorAll('[data-bulk-id]:checked')].map(x => x.dataset.bulkId);
    if (!ids.length) { toast('Tick at least one row'); return; }
    const list = ids.map(id => S.data.items.find(x => x.id === id)).filter(Boolean).map(i => ({ row: i.row, id: i.id }));
    el.disabled = true;
    google.script.run
      .withSuccessHandler(r => { S.bulk = false; renderLayer(); toast(((r && r.done) || []).length + ' moved to ' + ((r && r.stage) || 'the new stage')); load(); })
      .withFailureHandler(err => { el.disabled = false; toast('Could not update: ' + err.message); })
      .setStages(list, el.dataset.stage);
  }
  else if (el.dataset.act === 'save-actual') {
    const item = S.data.items.find(x => x.id === el.dataset.id); if (!item) return;
    const v = (document.getElementById('actualDays') || {}).value;
    el.disabled = true;
    google.script.run
      .withSuccessHandler(r => { item.actual = r.actual === '' ? null : r.actual; S.askActual = null; renderLayer(); toast('Actual days saved'); })
      .withFailureHandler(err => { el.disabled = false; toast('Could not save: ' + err.message); })
      .setActual(item.row, item.id, v === '' ? '' : Number(v));
  }
  else if (el.dataset.act === 'dismiss-dup') { S.detail = null; renderLayer(); save('setStage', el.dataset.id, 'stage', 'Dismissed', 'Dismissed as a duplicate'); }
  else if (el.dataset.act === 'hire-clear') { S.hireFrom = ''; render(); }
  else if (el.dataset.act === 'add') { S.adding = true; renderLayer(); }
  else if (el.dataset.act === 'feedback') { const tl = { mine: 'My work', overview: 'Overview', pipeline: 'Planning', board: 'Board', forecast: 'Forecast', activity: 'Activity', settings: 'Settings', faq: 'FAQ' }; S.feedback = { tab: S.tab, tabLabel: tl[S.tab] || S.tab }; renderLayer(); setTimeout(() => { const t = document.querySelector('#fbForm textarea'); if (t) t.focus(); }, 30); }
  else if (el.dataset.act === 'welcome') { S.welcome = true; renderLayer(); }
  else if (el.dataset.act === 'welcome-done' || el.dataset.act === 'welcome-go') {
    S.welcome = false; try { localStorage.setItem('kh_welcome', '1'); } catch (err) {}
    const to = el.dataset.to;
    if (to === 'timeoff') { S.timeoff = { edit: null, f: {} }; renderLayer(); }
    else if (to) { S.tab = to; render(); } else renderLayer();
  }
  else if (el.dataset.act === 'save-client') {
    const item = S.data.items.find(x => x.id === el.dataset.id); if (!item) return;
    const v = ((document.getElementById('clientIn') || {}).value || '').trim(), all = !!(document.getElementById('clientAll') || {}).checked;
    if (!v) { toast('Pick or type a client'); return; }
    el.disabled = true; el.textContent = 'Saving…';
    google.script.run.withSuccessHandler(r => { toast('Client set to ' + v + (r && r.others ? ' (and ' + r.others + ' more from that project)' : '')); load(); })
      .withFailureHandler(err => { el.disabled = false; el.textContent = 'Save'; toast('Could not save: ' + err.message); }).setClient(item.row, item.id, v, all);
  }
  else if (el.dataset.act === 'apply-range') {
    const t = el.dataset.type, mn = Number(el.dataset.min), mx = Number(el.dataset.max);
    el.disabled = true; el.textContent = 'Saving…';
    google.script.run.withSuccessHandler(() => { toast(t + ' is now ' + mn + '–' + mx + ' days'); load(); })
      .withFailureHandler(err => { el.disabled = false; el.textContent = 'Apply'; toast('Could not save: ' + err.message); }).applyTypeRange(t, mn, mx);
  }
  else if (el.dataset.act === 'timeoff' || el.dataset.act === 'to-new') { S.timeoff = { edit: null, f: {} }; renderLayer(); }
  else if (el.dataset.act === 'to-edit') {
    const o = S.data.timeOff.find(x => x.id === el.dataset.id); if (!o) return;
    S.timeoff = { edit: o.id, f: { name: o.name, type: o.type, start: o.start, end: o.end, half: o.half, part: o.part, cover: coverFrom(o.note, S.data.team, o.name), note: String(o.note || '').replace(/\s*coverage\s*:[^.;\n]*[.;]?/i, '').trim() } };
    renderLayer();
  }
  else if (el.dataset.act === 'to-del') {
    const k = 'to-' + el.dataset.id;
    if (S.confirm !== k) { S.confirm = k; renderLayer(); setTimeout(() => { if (S.confirm === k) { S.confirm = null; if (S.timeoff) renderLayer(); } }, 4000); return; }
    S.confirm = null; el.disabled = true;
    google.script.run.withSuccessHandler(() => { toast('Time off removed'); load(); setTimeout(() => { if (S.timeoff) renderLayer(); }, 50); })
      .withFailureHandler(err => { el.disabled = false; toast('Could not delete: ' + err.message); }).deleteTimeOff(el.dataset.id);
  }
  else if (el.dataset.act === 'sync') {
    S.syncing = true; render();
    google.script.run
      .withSuccessHandler(r => { S.syncing = false; S.data.sync = r.sync; const x = r.run;
        toast(x.ok ? 'Sync done: ' + x.added + ' new, ' + x.updated + ' updated' : 'Sync finished with problems. See Recent syncs.'); load(); })
      .withFailureHandler(err => { S.syncing = false; render(); toast('Sync failed: ' + err.message); })
      .runSyncFromDashboard();
  }
  else if (el.dataset.act === 'refresh-sync') { refreshSync(true); }
  else if (el.dataset.act === 'digest-bc') {
    el.disabled = true; el.textContent = 'Posting…';
    google.script.run
      .withSuccessHandler(r => { S.data.sync = r.sync; render(); const m = document.getElementById('digMsg'); if (m) m.innerHTML = `Draft posted to ${esc(r.info.project)}. Only you can see it. <a href="${esc(r.info.url)}" target="_blank" rel="noopener">Open it</a>`; })
      .withFailureHandler(err => { el.disabled = false; el.textContent = 'Post a preview to Basecamp'; const m = document.getElementById('digMsg'); if (m) m.textContent = 'Could not post: ' + err.message; })
      .postDigestPreviewFromDashboard();
  }
  else if (el.dataset.act === 'digest-preview') {
    el.disabled = true; el.textContent = 'Sending…';
    google.script.run
      .withSuccessHandler(r => { S.data.sync = r.sync; render(); toast('Preview sent to your inbox'); })
      .withFailureHandler(err => { el.disabled = false; el.textContent = 'Email me a preview'; toast('Could not send: ' + err.message); })
      .sendDigestPreviewFromDashboard();
  }
  else if (el.dataset.act === 'handover') {
    const item = S.data.items.find(x => x.id === el.dataset.id); if (!item) return;
    const from = el.dataset.from, to = (document.getElementById('handTo') || {}).value;
    if (!to) { toast('Pick who takes it over'); return; }
    let text = '', total = 0;
    if (item.est) {
      const a = Object.assign({}, item.alloc);
      a[to] = (a[to] || 0) + (a[from] || 0); delete a[from];
      const parts = Object.keys(a).filter(n => a[n] > 0).map(n => [n, Math.round(a[n] * 100) / 100]);
      text = parts.map(([n, v]) => n + ' ' + v).join('; ');
      total = parts.reduce((t, [, v]) => t + v, 0);
    }
    const newOwner = (item.owner === from || item.lead === from) ? to : '';
    el.disabled = true;
    google.script.run
      .withSuccessHandler(() => { toast('Handed to ' + to); load(); })
      .withFailureHandler(err => { el.disabled = false; toast('Could not hand over: ' + err.message); })
      .handOver(item.row, item.id, text, total, newOwner, from, to);
  }
  else if (el.dataset.act === 'client-date') {
    const item = S.data.items.find(x => x.id === el.dataset.id); if (!item) return;
    const on = !item.clientDate;
    el.disabled = true;
    google.script.run
      .withSuccessHandler(() => { item.clientDate = on; toast(on ? 'Marked as a client date' : 'Client date unlocked'); render(); })
      .withFailureHandler(err => { el.disabled = false; toast('Could not save: ' + err.message); })
      .setClientDate(item.row, item.id, on);
  }
  else if (el.dataset.act === 'save-split' || el.dataset.act === 'reset-split') {
    const item = S.data.items.find(x => x.id === el.dataset.id); if (!item) return;
    let text = '', total = 0;
    if (el.dataset.act === 'save-split') {
      const q = (attr, n) => document.querySelector('[' + attr + '="' + CSS.escape(n) + '"]');
      const rows = [...document.querySelectorAll('[data-split-name]')].map(inp => {
        const n = inp.dataset.splitName, w = q('data-split-win', n), o = q('data-split-owns', n);
        return { name: n, days: parseFloat(inp.value) || 0, win: w ? w.value : 'all', owns: o ? o.value.trim() : '' };
      }).filter(r => r.days > 0);
      const ovEl = document.querySelector('[data-split-ov]');
      const ov = ovEl && ovEl.value !== '' ? Number(ovEl.value) : null;
      if (!rows.length && ov === null) { toast('Enter days for at least one person'); return; }
      text = splitText(rows, ov);
      total = rows.reduce((t, r) => t + r.days, 0);
    }
    el.disabled = true;
    google.script.run
      .withSuccessHandler(() => { toast(text ? (total ? 'Split saved: ' + (Math.round(total * 100) / 100) + ' d hands-on' : 'Oversight saved') : 'Back to the default split'); load(); })
      .withFailureHandler(err => { el.disabled = false; toast('Could not save: ' + err.message); })
      .setSplit(item.row, item.id, text, total);
  }
  else if (el.dataset.act === 'disconnect' || el.dataset.act === 'takeover') {
    const act = el.dataset.act;
    if (S.confirm !== act) { S.confirm = act; render(); setTimeout(() => { if (S.confirm === act) { S.confirm = null; render(); } }, 5000); return; }
    S.confirm = null; el.disabled = true;
    google.script.run
      .withSuccessHandler(sy => { S.data.sync = sy; render(); toast(act === 'takeover' ? 'The daily sync now runs from your account' : 'Your Basecamp was disconnected'); })
      .withFailureHandler(err => { render(); toast('Could not update: ' + err.message); })
      [act === 'takeover' ? 'takeOverSync' : 'disconnectMine']();
  }
  else if (el.dataset.open) { if (S.detail !== el.dataset.open) { S.dtab = 'overview'; } S.detail = el.dataset.open; S.search = ''; renderLayer(); }
});
// After someone connects in the Basecamp tab, pick up the new status when they come back
document.addEventListener('click', e => { if (e.target.closest('[data-connect]')) { S.awaiting = true; setTimeout(render, 50); } });
window.addEventListener('focus', () => { if (S.awaiting) refreshSync(); });
// Re-reads who's connected and the last sync. Manual clicks show "Checking…", then a time stamp and a summary.
function refreshSync(manual) {
  if (manual) { S.refreshing = true; render(); }
  google.script.run
    .withSuccessHandler(sy => {
      const was = S.data.sync && S.data.sync.me.connected;
      S.data.sync = sy; S.refreshing = false;
      S.checkedAt = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (sy.me.connected) S.awaiting = false;
      render();
      if (!was && sy.me.connected) toast('Your Basecamp is connected');
      else if (manual) { const n = (sy.conns || []).filter(c => c.status === 'connected').length; toast('Status updated: ' + n + ' connected'); }
    })
    .withFailureHandler(err => { S.refreshing = false; render(); toast('Could not refresh: ' + err.message); })
    .refreshSyncStatus();
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bulkAll) document.querySelectorAll(`[data-bulk-grp="${t.dataset.bulkAll}"]`).forEach(x => { x.checked = t.checked; });
  if (t.dataset.bulkAll || t.dataset.bulkId) { const n = document.querySelectorAll('[data-bulk-id]:checked').length; const c = document.getElementById('bulkCount'); if (c) c.textContent = n + ' selected'; }
  if (t.id === 'hireFrom') { S.hireFrom = t.value; render(); }
  if ((t.id && t.id.indexOf('bk_') === 0) || t.dataset.bkp) { bookField(t); return; }
  if (t.dataset.likely) { const item = S.data.items.find(x => x.id === t.dataset.likely); if (item) { item.likelihood = t.value; render(); google.script.run.withSuccessHandler(() => toast('Likelihood: ' + t.value)).withFailureHandler(err => toast('Could not save: ' + err.message)).setPlanFields(item.row, item.id, { likelihood: t.value }); } return; }
  if (t.id === 'bClient') { S.bClient = t.value; render(); return; }
  if (t.id === 'mePick') { S.me = t.value; try { localStorage.setItem('kh_me', t.value); } catch (e) {} render(); }
  if (t.id === 'fcWeeks') { S.fcWeeks = Number(t.value); render(); }
});
function searchResults(q) {
  const box = document.getElementById('qres'); if (!box) return;
  const words = q.toLowerCase().split(/\s+/).filter(String);
  if (!words.length) { box.hidden = true; box.innerHTML = ''; return; }
  const hay = i => (i.id + ' ' + i.title + ' ' + i.account + ' ' + i.project + ' ' + i.team.join(' ')).toLowerCase();
  const hits = S.data.items.filter(i => i.stage !== 'Dismissed' && words.every(w => hay(i).indexOf(w) !== -1))
    .sort((a, b) => (a.open === b.open ? 0 : a.open ? -1 : 1) || ((b.e || 0) - (a.e || 0))).slice(0, 8);
  box.hidden = false;
  box.innerHTML = hits.length ? hits.map(i => `<button class="li" data-open="${esc(i.id)}"><span style="flex:none;width:6px;align-self:stretch;border-radius:3px;background:${CLIENT[i.client][0]}"></span><span class="main"><span>${esc(i.title)}</span><span class="sub">${esc(i.id)} · ${esc(i.client)} · ${esc(i.stage)}${i.e ? ' · due ' + fmt(i.e) : ''}</span></span></button>`).join('') : '<div class="sub" style="padding:10px">No matches</div>';
}
function bookField(t) {
  const k = t.id.slice(3), f = S.book.f;
  if (t.dataset.bkp) { f.people = [...document.querySelectorAll('[data-bkp]:checked')].map(x => x.dataset.bkp); t.closest('label').classList.toggle('on', t.checked); }
  else f[k] = t.value;
  const pv = document.getElementById('bkPreview'); if (pv) pv.innerHTML = bookPreview(S.data, f);
  if (k === 'type' || k === 'scale') { const dy = document.getElementById('bk_days'); if (dy) dy.placeholder = f.type ? typeEst(S.data, f.type, f.scale).toFixed(1) : '—'; }
}
document.addEventListener('input', e => {
  if (e.target.id === 'faqQ') { S.faqQ = e.target.value; render(); const q = document.getElementById('faqQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } return; }
  if (e.target.id && e.target.id.indexOf('bk_') === 0) { bookField(e.target); return; }
  if (e.target.id === 'q') { searchResults(e.target.value); return; }
  if (!e.target.dataset.splitName) return;
  const t = [...document.querySelectorAll('[data-split-name]')].reduce((a, x) => a + (parseFloat(x.value) || 0), 0);
  const el = document.getElementById('splitTotal'); if (el) el.textContent = 'Total ' + (Math.round(t * 100) / 100) + ' d';
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.stage) save('setStage', t.dataset.stage, 'stage', t.value, 'Stage updated in the Planner');
  if (t.dataset.booking) save('setBooking', t.dataset.booking, 'booking', t.value, 'Booking updated in the Planner');
});
document.addEventListener('keydown', e => {
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if (e.key === '/' && !typing) { const q = document.getElementById('q'); if (q) { e.preventDefault(); q.focus(); } return; }
  if (a && a.id === 'q') {
    if (e.key === 'Escape') { a.value = ''; searchResults(''); a.blur(); return; }
    if (e.key === 'Enter') { const first = document.querySelector('#qres [data-open]'); if (first) first.click(); return; }
  }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) { const box = document.getElementById('qres'); if (box) box.hidden = true; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (S.detail || S.adding || S.bulk || S.askActual || S.timeoff || S.feedback || S.welcome)) { if (S.welcome) { S.welcome = false; try { localStorage.setItem('kh_welcome', '1'); } catch (err) {} } S.detail = null; S.expanded = false; S.adding = false; S.bulk = false; S.askActual = null; S.timeoff = null; S.feedback = null; renderLayer(); } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'fbForm') return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target).entries()), msg = document.getElementById('fbMsg');
  if (!String(f.text || '').trim()) { msg.textContent = 'Add a few words first.'; return; }
  msg.textContent = 'Sending…';
  google.script.run.withSuccessHandler(() => { S.feedback = null; renderLayer(); toast('Thanks! Feedback sent.'); })
    .withFailureHandler(err => { msg.textContent = 'Could not send: ' + err.message; })
    .sendFeedback({ text: f.text, share: !!f.share, tab: S.feedback.tabLabel });
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#faq-"]'); if (!a) return;
  e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'toForm') return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target).entries());
  const msg = document.getElementById('toMsg');
  if (!f.end) f.end = f.start;
  if (!f.name || !f.start) { msg.textContent = 'Pick who is out and a start date.'; return; }
  const edit = S.timeoff && S.timeoff.edit;
  msg.textContent = 'Saving…';
  const done = () => { toast(edit ? 'Time off updated' : 'Time off added'); S.timeoff = { edit: null, f: {} }; load(); };
  const run = google.script.run.withSuccessHandler(done).withFailureHandler(err => { msg.textContent = err.message; });
  if (edit) run.updateTimeOff(edit, f); else run.addTimeOff(f);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target).entries());
  const msg = document.getElementById('addMsg');
  if (!f.link && !f.deliverable) { msg.textContent = 'Add a Basecamp link or a deliverable name.'; return; }
  msg.textContent = 'Adding…';
  google.script.run
    .withSuccessHandler(m => { S.adding = false; toast(m); load(); })
    .withFailureHandler(err => { msg.textContent = err.message; })
    .addDeliverable(f);
});

/* Drag and drop on the Board */
document.addEventListener('dragstart', e => {
  const c = e.target.closest('[data-card]'); if (!c) return;
  S.dragId = c.dataset.card;
  try { e.dataTransfer.setData('text/plain', S.dragId); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
  c.style.opacity = '.45';
});
document.addEventListener('dragend', () => { S.dragId = null; S.overCol = null; document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); render(); });
document.addEventListener('dragover', e => {
  const col = e.target.closest('[data-col]'); if (!col || !S.dragId) return;
  e.preventDefault();
  if (S.overCol !== col.dataset.col) { document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); col.classList.add('over'); S.overCol = col.dataset.col; }
});
document.addEventListener('drop', e => {
  const col = e.target.closest('[data-col]'); if (!col) return;
  e.preventDefault();
  const id = S.dragId; S.dragId = null; S.overCol = null;
  const item = S.data.items.find(x => x.id === id);
  if (item && item.stage !== col.dataset.col) save('setStage', id, 'stage', col.dataset.col, 'Moved to ' + col.dataset.col);
  else render();
});

/* ===== Load ===== */
function load() {
  google.script.run
    .withSuccessHandler(d => { S.data = prep(d); const w = document.getElementById('who'); if (w) w.textContent = d.me ? 'Signed in as ' + d.me : ''; render();
      if (!S.backupChecked) { S.backupChecked = true; const mine = (d.sync && d.sync.conns || []).find(c => c.me); if (mine && !mine.backup) google.script.run.withSuccessHandler(ok => { if (ok) mine.backup = true; }).ensureMyBackup(); } })
    .withFailureHandler(err => { document.getElementById('app').innerHTML = '<div class="loading">Could not load the planner: ' + esc(err.message) + '</div>'; })
    .getDashboardData({ lite: true });
}
try { const t0 = localStorage.getItem('kh_tab'); if (t0) S.tab = t0; } catch (e) {}
load();
// Quiet refresh every 5 minutes while the page is visible and nobody is mid-edit
setInterval(() => {
  if (document.visibilityState !== 'visible' || S.detail || S.adding || S.timeoff || S.feedback || S.welcome || S.bulk || S.askActual || S.dragId || S.syncing || S.book.open || S.planEdit) return;
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  const before = S.data && S.data.activity[0] ? S.data.activity[0].at : '';
  google.script.run.withSuccessHandler(d => {
    S.data = prep(d);
    const fresh = S.data.activity.filter(x => !before || x.at > before).length;
    render();
    if (fresh && S.tab !== 'activity') toast(fresh + ' new update' + (fresh > 1 ? 's' : '') + ' in Activity');
  }).getDashboardData({ lite: true });
}, 5 * 60 * 1000);
</script>
</body>
</html>
