<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Insights Planner | 1KH US [Beta]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#242624; --brand:#242624; --brand-tint:#ECEDF1; --accent:#6100DB; --accent-2:#4A00A8; --accent-tint:#F2E4FF; --ink:#242624; --muted:#5F6775; --soft:#5F6775; --line:#E6E7EB; --line2:#EEF0F3; --bg:#F1F2F5; --red:#DC2626; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: Figtree, Arial, sans-serif; color: var(--ink); font-size: 14px; }
  button { font-family: inherit; }
  a { color: #1F5FBF; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 20px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font-size: 28px; font-weight: 900; color: var(--ink); letter-spacing: .02em; text-transform: uppercase; }
  h2 { margin: 0; font-size: 15px; font-weight: 900; color: var(--ink); letter-spacing: .04em; text-transform: uppercase; }
  h3 { margin: 0; font-size: 14px; font-weight: 900; color: var(--ink); letter-spacing: .04em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; border: 1px solid var(--navy); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .pill { min-height: 34px; padding: 0 12px; border-radius: 17px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #CBD5E1; background: #fff; color: #1F2937; }
  .pill.on { background: var(--accent-tint); border-color: var(--accent-tint); color: var(--accent); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; background: #EEF1F5; padding: 4px; border-radius: 10px; }
  .seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; color: #1F2937; }
  .seg button.on { background: var(--accent-tint); color: var(--accent); }
  .qlink { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 19px; background: #fff; border: 1px solid #D6DCE5; color: #1F2937; font-size: 13px; font-weight: 600; text-decoration: none; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #DDE2E9; flex-wrap: wrap; }
  .tabs button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .count { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 2px 7px; background: #E5E7EB; color: #374151; }
  .tabs button.on .count { background: var(--accent-tint); color: var(--accent); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .kpi .l { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .kpi .v { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .kpi .s { font-size: 12px; color: var(--soft); }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: 12px; color: #374151; }
  .legend b { color: #1F2937; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
  .tl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .tlhead, .lane { display: grid; grid-template-columns: 250px 1fr; }
  .tlhead { border-bottom: 1px solid var(--line); }
  .lane { border-bottom: 1px solid var(--line2); }
  .who { padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .av { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: none; background: var(--brand-tint); color: var(--brand); }
  .mini { width: 22px; height: 22px; font-size: 10px; border: 2px solid #fff; margin-left: -6px; }
  .topbar { background: #fff; border-bottom: 1px solid #E1E2E5; }
  .appicon { width: 28px; height: 28px; flex: none; display: block; }
  .topbar .in { max-width: 1400px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .notes { display: flex; flex-direction: column; gap: 10px; }
  .note { border-radius: 12px; padding: 10px 12px; background: #F8F9FA; border: 1px solid var(--line2); }
  .note .h { font-size: 12px; font-weight: 800; color: var(--ink); }
  .note .b { font-size: 14px; line-height: 1.5; white-space: pre-line; margin-top: 2px; }
  textarea.nt { width: 100%; min-height: 84px; padding: 10px; border: 1px solid #CBD5E1; border-radius: 10px; font: inherit; resize: vertical; }
  .meter { flex: 1; height: 8px; border-radius: 4px; background: #EEF1F5; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; }
  .track { position: relative; }
  .tint { position: absolute; top: 0; bottom: 0; border-left: 1px solid #F1F3F6; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .bar { position: absolute; z-index: 2; height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 22px 0 10px; font-size: 12px; font-weight: 700; overflow: hidden; border-radius: 8px; cursor: pointer; text-align: left; font-family: inherit; white-space: nowrap; }
  .bar.ovb { height: 20px; font-size: 11px; font-weight: 600; padding: 0 8px; }
  .bar.ovb .t { font-weight: 600; } .bar.ovb .m { font-size: 10px; }
  .bar .t { flex: none; max-width: 60%; }
  .bar .m { flex: 1; min-width: 0; }
  .dm { position: absolute; top: 3px; width: 7px; height: 7px; transform: translateX(-50%) rotate(45deg); z-index: 1; }
  .lk { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); display: inline-flex; z-index: 1; }
  .lstrip { display: grid; gap: 4px; padding: 6px 4px 0; }
  .lc { height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; }
  .tint.off { color: #5F6775; align-items: flex-start; padding-top: 4px; }
  .bar .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .bar .m { font-size: 10px; font-weight: 500; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .prio { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 20px; height: 20px; border-radius: 5px; }
  .flag { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 2px 6px; background: #fff; color: #B91C1C; box-shadow: 0 0 0 1px #F3B4B4; }
  .flag.past { background: var(--red); color: #fff; box-shadow: none; }
  .today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .45; z-index: 1; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .li { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line2); background: #fff; text-align: left; font: inherit; color: var(--ink); }
  button.li { cursor: pointer; }
  .li .main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .li .main span:first-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 12px; color: var(--soft); }
  .empty { font-size: 13px; color: var(--soft); padding: 12px; border: 1px dashed #D1D5DB; border-radius: 10px; }
  .board { overflow-x: auto; padding-bottom: 4px; }
  .cols { display: grid; gap: 12px; }
  .col { border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 180px; background: #EAEEF3; }
  .col.over { background: #DCE6FB; box-shadow: inset 0 0 0 2px #2557D6; }
  .kcard { width: 100%; text-align: left; font: inherit; cursor: grab; background: #fff; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(17,24,39,.06); border: 1px solid var(--line); border-top-width: 4px; }
  .chip { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
  table.t { width: 100%; border-collapse: collapse; background: #fff; }
  table.t th { text-align: left; font-size: 12px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 10px 12px; border-bottom: 1px solid #F1F3F6; vertical-align: middle; }
  .overlay { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
  .scrim { position: absolute; inset: 0; border: 0; background: rgba(17,24,39,.35); cursor: pointer; }
  .drawer { position: relative; width: 480px; max-width: 100%; height: 100%; background: #fff; box-shadow: -12px 0 32px rgba(17,24,39,.18); overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .modal { position: relative; margin: auto; width: 520px; max-width: calc(100% - 32px); max-height: calc(100% - 32px); overflow-y: auto; background: #fff; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 48px rgba(17,24,39,.25); }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
  label.f input, label.f select { min-height: 42px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--ink); background: #fff; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  .brief { font-size: 14px; line-height: 1.55; white-space: pre-line; border-radius: 10px; padding: 14px; background: #F9FAFB; border: 1px solid var(--line); }
  .brief.none { border-style: dashed; color: var(--soft); }
  .x { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 60; }
  .loading { padding: 80px 0; text-align: center; color: var(--soft); }
  @media (max-width: 720px) { .tlhead, .lane { grid-template-columns: 170px 1fr; } .grid2 { grid-template-columns: 1fr; } }
  /* Work back schedule (WBS) */
  .wseg { position: absolute; top: 0; bottom: 0; z-index: 0; }
  .ms { position: absolute; bottom: 3px; width: 9px; height: 9px; transform: translateX(-50%) rotate(45deg); border: 1.5px solid #fff; z-index: 1; }
  .bar > :not(.wseg):not(.ms):not(.dm):not(.lk) { position: relative; z-index: 1; }
  .wbs { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .wbs .st { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line2); font-size: 13px; }
  .wbs .st:first-child { border-top: 0; }
  .wbs .st.now { background: var(--accent-tint); }
  .wbs .st.done { color: var(--soft); }
  .wbs .ic { width: 10px; height: 10px; border-radius: 50%; justify-self: center; }
  .wbs .ic.ms { position: static; transform: rotate(45deg); border-radius: 1px; border: 0; width: 9px; height: 9px; }
  /* Days per person */
  .split { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .sp { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  .sp.on { border-color: #D8C2FA; background: #FBF8FF; }
  .sp input { width: 72px; min-height: 36px; padding: 0 8px; border: 1px solid #CBD5E1; border-radius: 8px; font: inherit; font-size: 14px; text-align: right; }
  /* Basecamp replies */
  .replies { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
  .reply { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
  .reply.ext { border-color: #A7E3C0; background: #F3FBF6; }
  .reply .h { font-size: 12px; font-weight: 800; }
  .reply .b { font-size: 13px; line-height: 1.5; white-space: pre-line; margin-top: 2px; }
  /* Activity */
  .feed { display: flex; flex-direction: column; }
  .aday { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--soft); padding: 14px 0 6px; border-bottom: 1px solid var(--line2); }
  .act { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; align-items: start; padding: 10px 4px; border-bottom: 1px solid var(--line2); }
  .act .stat { justify-content: center; }
  .act.unseen { background: #FBF8FF; box-shadow: inset 3px 0 0 var(--accent); }
  .act .main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .atext { font-size: 13px; line-height: 1.5; white-space: pre-line; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .alink { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--accent); cursor: pointer; text-align: left; }
  @media (max-width: 720px) { .act { grid-template-columns: 1fr; } }
  .tlchip { font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px; background: #FEF3C7; color: #92400E; white-space: nowrap; }
  /* Bulk clean-up */
  .bgrp { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line2); padding-top: 10px; }
  .brow { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
  .brow:hover { background: #F8F9FA; }
  .brow .main { display: flex; flex-direction: column; min-width: 0; }
  .modal input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
  /* Forecast */
  table.fc td { text-align: center; font-size: 12px; font-weight: 700; padding: 8px 6px; border: 2px solid #fff; border-radius: 6px; }
  table.fc th { text-align: center; white-space: nowrap; }
  .cbar { height: 6px; background: #F1F2F5; border-radius: 3px; overflow: hidden; margin-bottom: 3px; min-width: 80px; }
  .cbar i { display: block; height: 100%; border-radius: 3px; }
  /* Card view */
  .card2 { width: 620px; gap: 14px; padding: 0 24px 24px; }
  .card2 > *, .cpage > * { flex-shrink: 0; }
  .chead { position: sticky; top: 0; z-index: 2; background: #fff; padding: 20px 0 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line2); }
  .glance { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .gt { background: #F8F9FA; border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .gt .k { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--soft); }
  .gt .v { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gt .sub { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  details.alerts { border: 1px solid #F5D9A8; background: #FFFBF2; border-radius: 12px; padding: 10px 12px; }
  details.alerts summary { cursor: pointer; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; list-style: none; }
  details.alerts[open] summary { margin-bottom: 8px; }
  details.alerts .callout { margin-top: 6px; }
  .dtabs { border-bottom: 1px solid #DDE2E9; }
  .dtabs button { min-height: 40px; padding: 0 12px; font-size: 13px; }
  .dpane { display: flex; flex-direction: column; gap: 14px; }
  .lbl { font-size: 12px; font-weight: 700; color: var(--soft); }
  dl.facts { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
  dl.facts dt { color: var(--soft); font-weight: 700; } dl.facts dd { margin: 0; }
  .sel { min-height: 40px; border: 1px solid #CBD5E1; border-radius: 8px; padding: 0 8px; font: inherit; }
  .sbar { display: flex; height: 30px; border-radius: 8px; overflow: hidden; gap: 2px; }
  .sbar span { display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; }
  .reply.tnote { background: #F8F9FA; }
  .page-ov { background: var(--bg); overflow-y: auto; display: block; }
  .cpage { max-width: 1320px; margin: 0 auto; padding: 0 24px 40px; display: flex; flex-direction: column; gap: 16px; }
  .cpage .chead { background: var(--bg); }
  .cgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .ccol { display: flex; flex-direction: column; gap: 16px; }
  .psec { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 900px) { .cgrid { grid-template-columns: 1fr; } .glance { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* Search, quick actions */
  .search { position: relative; }
  .search input { width: 280px; min-height: 42px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font: inherit; background: #fff; }
  .search input:focus { outline: 2px solid var(--accent-tint); border-color: var(--accent); }
  .qres { position: absolute; z-index: 30; top: 48px; right: 0; width: 420px; max-width: 90vw; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(17,24,39,.16); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .qres[hidden] { display: none; }
  .kwrap { position: relative; }
  .kact { position: absolute; top: 6px; right: 6px; display: none; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 4px 12px rgba(17,24,39,.12); }
  .kwrap:hover .kact, .kwrap:focus-within .kact { display: flex; }
  .kact button, .kact a { border: 0; background: #F8F9FA; border-radius: 7px; padding: 4px 8px; font: inherit; font-size: 11px; font-weight: 700; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
  .kact button:hover, .kact a:hover { background: var(--accent-tint); color: var(--accent); }
  /* Phone */
  @media (max-width: 720px) {
    .wrap { padding: 16px 12px 40px; gap: 14px; }
    .topbar .in { padding: 10px 12px; }
    h1 { font-size: 22px; }
    .search input { width: 100%; } .search { flex: 1 1 100%; } .qres { left: 0; right: auto; width: 100%; }
    .wrap > * { min-width: 0; max-width: 100%; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
    .tabs button { flex: none; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .panels, .sgrid { grid-template-columns: minmax(0, 1fr); }
    .card { min-width: 0; }
    .card2, .drawer { width: 100%; padding: 0 14px 20px; }
    .glance { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    dl.facts { grid-template-columns: 1fr; } dl.facts dt { margin-top: 6px; }
    .cpage { padding: 0 12px 24px; }
    .kact { display: flex; position: static; margin-top: 4px; box-shadow: none; }
  }
  /* Board rails, compact cards, stuck */
  .col.rail { min-height: 180px; padding: 10px 0; align-items: center; cursor: pointer; border: 0; font: inherit; color: var(--muted); }
  .col.rail.has { background: #FFF4E5; color: #92400E; }
  .col.rail .rtext { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; font-size: 13px; }
  .kcard.compact { gap: 4px; padding: 8px 10px; border-top-width: 1px; }
  .kcard.compact .ktitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; text-align: left; }
  .stuck { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .btools { gap: 8px; }
  .bseg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
  .bseg button { border: 0; background: none; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; min-height: 30px; }
  .bseg button.on { background: var(--accent-tint); color: var(--accent); }
  .btools .lbl { margin-left: 4px; }
  details.faq { border-top: 1px solid var(--line2); padding: 10px 0; }
  details.faq summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  details.faq summary::after { content: '+'; color: var(--muted); font-weight: 700; }
  details.faq[open] summary::after { content: '–'; }
  details.faq summary::-webkit-details-marker { display: none; }
  .faqa { padding: 8px 0 2px; color: #374151; line-height: 1.55; font-size: 14px; }
  .faqa ol, .faqa ul { margin: 6px 0; padding-left: 20px; }
  .faqa code { background: #F1F2F5; border-radius: 4px; padding: 1px 4px; }
  .faqnav { gap: 6px; }
  .faqnav .pill { text-decoration: none; display: inline-flex; align-items: center; }
  .welcome h2 { font-size: 20px; }
  .wsteps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .wstep { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .wstep b { font-size: 14px; }
  @media (max-width: 720px) { .wsteps { grid-template-columns: minmax(0, 1fr); } }
  .clientrow { display: flex; gap: 8px; align-items: flex-end; }
  /* Planning */
  .bookcard { border-color: #D8C2FA; }
  .bgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; }
  .bgrid .f > span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .bkprev { background: #F8F9FA; border: 1px solid var(--line2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .plist { display: flex; flex-direction: column; }
  .prow { display: grid; grid-template-columns: minmax(220px, 300px) 104px minmax(240px, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line2); }
  .prow.head { padding: 0 0 4px; }
  .pinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ptrack { position: relative; height: 30px; background: repeating-linear-gradient(90deg, #F8F9FA 0 calc(100%/13 - 1px), #EEF0F3 calc(100%/13 - 1px) calc(100%/13)); border-radius: 6px; }
  .ptrack.axis { background: none; height: 16px; }
  .ptrack.axis span { position: absolute; font-size: 10px; color: var(--soft); white-space: nowrap; }
  .pbar { position: absolute; top: 5px; height: 20px; border-radius: 6px; box-sizing: border-box; }
  .pact { display: flex; gap: 4px; flex-wrap: wrap; }
  .pact .pill { min-height: 30px; padding: 0 10px; }
  .like { min-height: 32px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 12px; padding: 0 4px; }
  .pedit { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #FBF8FF; border-radius: 10px; padding: 8px; }
  @media (max-width: 900px) { .bgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .prow { grid-template-columns: 1fr; } .prow.head { display: none; } }
  /* Settings */
  .schip { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .schip:hover { border-color: #CBD5E1; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: #10B981; } .dot.warn { background: #D97706; } .dot.bad { background: var(--red); } .dot.off { background: #9CA3AF; }
  .stat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 12px; padding: 3px 10px; white-space: nowrap; }
  .stat.ok { background: #DCFCE7; color: #166534; } .stat.warn { background: #FEF3C7; color: #92400E; } .stat.bad { background: #FDECEC; color: #991B1B; } .stat.off { background: #F1F2F5; color: var(--muted); }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .callout { border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  .callout.warn { background: #FFF8EB; border: 1px solid #F5D9A8; color: #7C4A03; }
  .callout.info { background: #F8F9FA; border: 1px solid var(--line2); color: var(--muted); }
  .kv { display: flex; flex-direction: column; gap: 2px; } .kv .k { font-size: 12px; font-weight: 700; color: var(--soft); } .kv .v { font-size: 15px; font-weight: 700; }
  ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.5; }
</style>
</head>

function horizons(T) {

    today: { label: 'Today', s: T, e: T, gran: 'day' },
    week: { label: 'This week', s: m, e: add(m, 4), gran: 'day' },
    next: { label: 'Next week', s: add(m, 7), e: add(m, 11), gran: 'day' },
    month: { label: 'Next 30 days', s: T, e: add(T, 29), gran: 'week' },
    quarter: { label: 'Rest of ' + qName(T), s: T, e: qEnd, gran: 'week' },

}

      <div class="kpi"><span class="l">This week</span><span class="v" style="color:${tone(thisW)}">${thisW === null ? 'Out' : thisW + '%'}</span><span class="s">of your available days booked</span></div>
      <div class="kpi"><span class="l">Next week</span><span class="v" style="color:${tone(nextW)}">${nextW === null ? 'Out' : nextW + '%'}</span><span class="s">of your available days booked</span></div>
      <div class="kpi"><span class="l">Open deliverables</span><span class="v">${mine.length}</span><span class="s">${mine.filter(i => i.lead === me).length} as lead</span></div>
      <div class="kpi"><span class="l">Needs attention</span><span class="v" style="color:${attention.length ? '#B45309' : 'var(--ink)'}">${attention.length}</span><span class="s">hand-overs, timeline changes, duplicates</span></div>
    </div>
    <div class="panels">
      <div class="card"><div class="row between"><h3>This week</h3><span class="sub">${fmt(T)} to ${fmt(add(T, 6))}</span></div>${now.length ? now.map(row).join('') : '<div class="empty">Nothing scheduled this week.</div>'}</div>
      <div class="card"><div class="row between"><h3>Coming up</h3><span class="sub">Next 4 weeks</span></div>${soon.length ? soon.map(row).join('') : '<div class="empty">Nothing else starting in the next four weeks.</div>'}${undated.length ? `<span class="lbl">No dates yet</span>${undated.map(row).join('')}` : ''}</div>
      <div class="card"><h3>Needs your attention</h3>${attention.length ? attention.map(row).join('') : '<div class="empty">Nothing needs you right now.</div>'}</div>
      <div class="card"><h3>Recent replies on your work</h3>${replies.length ? replies.map(a => `<button class="li" data-open="${esc(a.id)}"><span class="main"><span>${esc(a.title)}</span><span class="sub">${esc(a.who)} · ${whenLabel(a.at, T)} · ${esc(String(a.text).replace(/\s+/g, ' ').slice(0, 90))}</span></span></button>`).join('') : '<div class="empty">No replies in the last week.</div>'}</div>
    </div>`;
}

/* ===== Forecast: capacity gap, client workload, estimate check ===== */
function forecast(d, T) {
  const W0 = monday(T), nW = S.fcWeeks || 13;
  const weeks = [];
  for (let k = 0; k < nW; k++) { const s = add(W0, k * 7); weeks.push({ s, e: add(s, 4) }); }
  const open = d.items.filter(i => i.open && i.rate && i.s && i.e);
  const hire = S.hireFrom ? P(S.hireFrom) : null;
  weeks.forEach(w => {
    w.avail = d.people.reduce((t, p) => t + availFor(p, w.s, w.e), 0);
    w.hire = hire && w.e >= hire ? wd(maxD(w.s, hire), w.e) * 0.9 : 0;
    w.conf = open.filter(i => !i.tent).reduce((t, i) => t + itemLoad(i, w.s, w.e), 0);
    w.tent = open.filter(i => i.tent).reduce((t, i) => t + itemLoad(i, w.s, w.e) * likeOf(i), 0);
    w.need = w.conf + w.tent;
    w.gap0 = w.need - w.avail;
    w.gap = w.need - (w.avail + w.hire);
  });
  const short = weeks.filter(w => w.gap0 > 0.05);
  const worst = short.slice().sort((a, b) => b.gap0 - a.gap0)[0];
  const lead = short.length
    ? `Booked and pencilled-in work is more than the team can cover in <b>${short.length} of ${nW} weeks</b>, short by <b>${short.reduce((t, w) => t + w.gap0, 0).toFixed(1)} days</b> in total. The tightest is the week of ${fmt(worst.s)}, ${worst.gap0.toFixed(1)} days over.`
    : `The team can cover all booked and pencilled-in work for the next ${nW} weeks.`;

  // Chart: stacked bars (confirmed, tentative) against capacity lines
  const Wd = 1000, H = 260, pl = 44, pr = 10, pt = 14, pb = 34, cw = (Wd - pl - pr) / nW;
  const top = Math.max(5, ...weeks.map(w => Math.max(w.need, w.avail + w.hire))) * 1.12;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const ticks = []; const step = top > 40 ? 10 : 5; for (let v = 0; v <= top; v += step) ticks.push(v);
  const bars = weeks.map((w, k) => { const x = pl + k * cw + cw * 0.18, bw = cw * 0.64;
    return `<rect x="${x}" y="${y(w.conf)}" width="${bw}" height="${y(0) - y(w.conf)}" fill="#3F4A5A" rx="2"><title>Week of ${fmt(w.s)}: ${w.conf.toFixed(1)} d confirmed</title></rect>
      <rect x="${x}" y="${y(w.need)}" width="${bw}" height="${y(w.conf) - y(w.need)}" fill="url(#hatch)" stroke="#8A94A3" stroke-width="1"><title>Week of ${fmt(w.s)}: ${w.tent.toFixed(1)} d tentative</title></rect>
      ${w.gap > 0.05 ? `<rect x="${x - 2}" y="${y(w.need) - 6}" width="${bw + 4}" height="4" fill="#DC2626" rx="2"><title>${w.gap.toFixed(1)} d over capacity</title></rect>` : ''}
      <text x="${x + bw / 2}" y="${H - pb + 16}" text-anchor="middle" font-size="11" fill="#5F6775">${fmt(w.s)}</text>`; }).join('');
  const line = key => weeks.map((w, k) => `${k ? 'L' : 'M'}${pl + k * cw + 2},${y(key(w))} L${pl + (k + 1) * cw - 2},${y(key(w))}`).join(' ');
  const chart = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Weekly booked days against team capacity" style="width:100%;height:auto;display:block">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E6EB"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8A94A3" stroke-width="2"/></pattern></defs>
    ${ticks.map(v => `<line x1="${pl}" x2="${Wd - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF0F3"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5F6775">${v}</text>`).join('')}
    ${bars}
    <path d="${line(w => w.avail)}" fill="none" stroke="#047857" stroke-width="2.5"/>
    ${hire ? `<path d="${line(w => w.avail + w.hire)}" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6 4"/>` : ''}
    <text x="${pl}" y="10" font-size="11" fill="#5F6775">Days</text></svg>`;

  // Allocation % by person and week
  const heat = v => v === null ? 'background:#F1F2F5;color:#5F6775' : v > 100 ? 'background:#FDECEC;color:#991B1B' : v >= 90 ? 'background:#FEF3C7;color:#92400E' : v >= 70 ? 'background:#FFF8EB;color:#92400E' : 'background:#EAF7F0;color:#047857';
  const grid = `<div style="overflow-x:auto"><table class="t fc"><thead><tr><th>Person</th>${weeks.map(w => `<th>${fmt(w.s)}</th>`).join('')}</tr></thead><tbody>${d.people.map(p => `<tr><td style="white-space:nowrap;font-weight:700">${esc(p.name)}</td>${weeks.map(w => { const a = availFor(p, w.s, w.e), b = loadFor(p.name, w.s, w.e); const v = a ? Math.round(b / a * 100) : null; return `<td style="${heat(v)}" title="${b.toFixed(1)} of ${a.toFixed(1)} d">${v === null ? 'Out' : v + '%'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;

  // Days by client per month (this month and the next three)
  const months = [0, 1, 2, 3].map(k => { const s = new Date(T.getFullYear(), T.getMonth() + k, 1); return { s, e: new Date(s.getFullYear(), s.getMonth() + 1, 0), label: MON[s.getMonth()] + (s.getFullYear() !== T.getFullYear() ? ' ' + s.getFullYear() : '') }; });
  const byClient = {};
  open.forEach(i => { const k = i.account || 'Other'; byClient[k] = byClient[k] || months.map(() => ({ c: 0, t: 0 })); months.forEach((m, j) => { const v = itemLoad(i, m.s, m.e); if (i.tent) byClient[k][j].t += v; else byClient[k][j].c += v; }); });
  const clientRows = Object.keys(byClient).map(k => ({ k, v: byClient[k], tot: byClient[k].reduce((t, x) => t + x.c + x.t, 0) })).filter(r => r.tot > 0.05).sort((a, b) => b.tot - a.tot);
  const maxCell = Math.max(1, ...clientRows.flatMap(r => r.v.map(x => x.c + x.t)));
  const clients = clientRows.length ? `<div style="overflow-x:auto"><table class="t"><thead><tr><th>Account</th>${months.map(m => `<th>${m.label}</th>`).join('')}<th style="text-align:right">Total</th></tr></thead><tbody>${clientRows.map(r => `<tr><td style="white-space:nowrap"><span class="sw" style="background:${CLIENT[clientOf(r.k)][0]}"></span>${esc(r.k)}</td>${r.v.map(x => { const t = x.c + x.t; return `<td><div class="cbar"><i style="width:${t / maxCell * 100}%;background:${CLIENT[clientOf(r.k)][0]};opacity:${x.c >= x.t ? 1 : .55}"></i></div><span class="sub">${t ? t.toFixed(1) + ' d' + (x.t > 0.05 ? ' (' + x.t.toFixed(1) + ' tentative)' : '') : '—'}</span></td>`; }).join('')}<td style="text-align:right;font-weight:700">${r.tot.toFixed(1)} d</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No estimated work in the next four months.</div>';

  // Estimate check: actual vs estimated days by type
  const done = d.items.filter(i => i.actual != null && i.est);
  const byType = {};
  done.forEach(i => { const k = i.type || 'Other'; (byType[k] = byType[k] || []).push(i); });
  // Suggested range per type = the middle half of actual days (25th to 75th percentile), rounded to half days; needs 3+ actuals
  const pctl = (arr, q) => { const v = arr.slice().sort((x, y) => x - y), k = (v.length - 1) * q, lo = Math.floor(k); return v[lo] + (v[Math.min(lo + 1, v.length - 1)] - v[lo]) * (k - lo); };
  const half = x => Math.max(0.5, Math.round(x * 2) / 2);
  const est = done.length ? `<div style="overflow-x:auto"><table class="t"><thead><tr><th>Type</th><th>With actuals</th><th>Avg estimate</th><th>Avg actual</th><th>Actual vs estimate</th><th>Range now</th><th>Suggested from actuals</th></tr></thead><tbody>${Object.keys(byType).sort().map(k => {
    const L = byType[k], ae = L.reduce((t, i) => t + i.est, 0) / L.length, aa = L.reduce((t, i) => t + i.actual, 0) / L.length, r = aa / ae;
    const now = d.lists.typeRanges && d.lists.typeRanges[k];
    const sug = L.length >= 3 ? [half(pctl(L.map(i => i.actual), 0.25)), half(pctl(L.map(i => i.actual), 0.75))] : null;
    const same = sug && now && sug[0] === now[0] && sug[1] === now[1];
    return `<tr><td>${esc(k)}</td><td>${L.length}</td><td>${ae.toFixed(1)} d</td><td>${aa.toFixed(1)} d</td><td style="font-weight:700;color:${r > 1.15 ? '#B91C1C' : r < 0.85 ? '#1E40AF' : '#047857'}">${Math.round(r * 100)}%</td>
      <td>${now ? now[0] + '–' + now[1] + ' d' : '—'}</td>
      <td>${!sug ? '<span class="sub">Needs 3 or more</span>' : same ? '<span class="sub">Matches</span>' : `<span class="row" style="gap:6px;flex-wrap:nowrap">${sug[0]}–${sug[1]} d <button class="pill" data-act="apply-range" data-type="${esc(k)}" data-min="${sug[0]}" data-max="${sug[1]}">Apply</button></span>`}</td></tr>`; }).join('')}</tbody></table></div><span class="sub">Apply writes the new range to the Lists tab. Every row of that Type without Override days re-estimates on the next load.</span>` : '<div class="empty">Fills in as people record actual days when work moves to Delivered.</div>';

  return `<section class="card"><div class="row between"><div style="display:flex;flex-direction:column;gap:2px"><h2>Capacity forecast</h2><span class="sub">Team days per week, Mon–Fri, after billable %, time off and holidays</span></div>
      <div class="row"><label class="sub">Weeks <select id="fcWeeks" style="min-height:34px;border:1px solid #CBD5E1;border-radius:8px;font:inherit">${[8, 13, 26].map(n => `<option ${n === nW ? 'selected' : ''} value="${n}">${n}</option>`).join('')}</select></label>
      <label class="sub">New hire starts <input type="date" id="hireFrom" value="${esc(S.hireFrom)}" style="min-height:34px;border:1px solid #CBD5E1;border-radius:8px;font:inherit;padding:0 6px"></label>${S.hireFrom ? '<button class="pill" data-act="hire-clear">Clear</button>' : ''}</div></div>
    <p style="margin:0;font-size:15px;line-height:1.5">${lead}${hire ? ` With a new hire at 90% from ${fmt(hire)}, ${weeks.filter(w => w.gap > 0.05).length ? 'the gap narrows to ' + weeks.filter(w => w.gap > 0.05).reduce((t, w) => t + w.gap, 0).toFixed(1) + ' days.' : 'every week is covered.'}` : ''}</p>
    <div class="legend"><span><span class="sw" style="background:#3F4A5A"></span>Confirmed</span><span><span class="sw" style="background:repeating-linear-gradient(45deg,#E3E6EB 0 3px,#8A94A3 3px 5px)"></span>Tentative, weighted by likelihood</span><span><span class="sw" style="background:#047857;height:3px;vertical-align:4px"></span>Team capacity</span>${hire ? '<span><span class="sw" style="border-top:2px dashed #047857;height:0;vertical-align:4px"></span>With new hire</span>' : ''}<span><span class="sw" style="background:#DC2626;height:4px;vertical-align:4px"></span>Over capacity</span></div>
    ${chart}</section>
  <section class="card"><h2>Allocation by person</h2><span class="sub">Share of each person's available days booked, per week. Leave cover is applied.</span>${grid}</section>
  <section class="card"><h2>Days by client</h2><span class="sub">Estimated days per month, confirmed and tentative. Faded bars are mostly tentative.</span>${clients}</section>
  <section class="card"><h2>Estimate check</h2><span class="sub">Actual vs estimated days for delivered work, by deliverable type, with a suggested range once 3 or more have actual days.</span>${est}</section>
  ${utilization(d, T)}`;
}

/* ===== Booked vs logged: planner estimates against the Timesheets tab ===== */
function utilization(d, T) {
  const ts = d.timesheets || [];
  const HOURS = 8, weeks = [];
  for (let k = 8; k >= 1; k--) { const s = add(monday(T), -7 * k); weeks.push({ s, e: add(s, 4), key: key2(s) }); }
  if (!ts.length) return `<section class="card"><h2>Booked vs logged</h2><span class="sub">Compares what the planner booked with the hours people logged. Add rows to the Timesheets tab (Week of, Name, Client, Hours) or paste your timesheet export there, and this fills in.</span></section>`;
  const logged = (name, w) => ts.filter(x => x.name === name && x.week === w.key).reduce((t, x) => t + x.hours, 0);
  const rows = d.people.map(p => {
    const cells = weeks.map(w => ({ b: bookedFor(p.name, w.s, w.e) * HOURS, l: logged(p.name, w), a: availFor(p, w.s, w.e) * HOURS }));
    const has = cells.filter(c => c.l > 0);
    const B = has.reduce((t, c) => t + c.b, 0), Lg = has.reduce((t, c) => t + c.l, 0), A = has.reduce((t, c) => t + c.a, 0);
    return { p, has: has.length, B, Lg, A };
  }).filter(r => r.has);
  const byClient = {};
  ts.filter(x => weeks.some(w => w.key === x.week)).forEach(x => { byClient[x.client || 'Other'] = (byClient[x.client || 'Other'] || 0) + x.hours; });
  const clients = Object.keys(byClient).sort((a, b) => byClient[b] - byClient[a]);
  return `<section class="card"><h2>Booked vs logged</h2><span class="sub">Last 8 weeks with timesheet entries. Hours booked = planner days × ${HOURS}. Utilization = logged hours ÷ billable hours available.</span>
    <div style="overflow-x:auto"><table class="t"><thead><tr><th>Person</th><th>Weeks logged</th><th>Booked h</th><th>Logged h</th><th>Logged vs booked</th><th>Utilization</th></tr></thead><tbody>
    ${rows.map(r => { const v = r.B ? r.Lg / r.B : null, u = r.A ? r.Lg / r.A : null; return `<tr><td>${esc(r.p.name)}</td><td>${r.has}</td><td>${r.B.toFixed(0)}</td><td>${r.Lg.toFixed(0)}</td>
      <td style="font-weight:700;color:${v === null ? 'inherit' : v > 1.2 ? '#B91C1C' : v < 0.8 ? '#1E40AF' : '#047857'}">${v === null ? '—' : Math.round(v * 100) + '%'}${v !== null && v > 1.2 ? ' <span class="sub">planner under-books</span>' : v !== null && v < 0.8 ? ' <span class="sub">planner over-books</span>' : ''}</td>
      <td>${u === null ? '—' : Math.round(u * 100) + '%'}</td></tr>`; }).join('') || '<tr><td colspan="6" class="sub">No timesheet rows match the Team tab names yet. Use names like Tayler M.</td></tr>'}</tbody></table></div>
    ${clients.length ? `<div><span class="lbl">Logged hours by client, last 8 weeks</span><div class="row" style="margin-top:6px">${clients.map(c => `<span class="chip" style="background:#F1F2F5;color:#374151">${esc(c)} · ${byClient[c].toFixed(0)} h</span>`).join('')}</div></div>` : ''}
  </section>`;
}

const ACT = {
  reply: ['Reply', 'background:#EEF0F3;color:#374151'], delivered: ['Sent to client', 'background:#DCFCE7;color:#166534'],
  timeline: ['Timeline', 'background:#FEF3C7;color:#92400E'], new: ['New to-do', 'background:#DCE6FB;color:#1E40AF'],
  stage: ['Stage', 'background:#F2E4FF;color:#6100DB'], handover: ['Hand-over', 'background:#FDECEC;color:#991B1B'],
  split: ['Split', 'background:#F2E4FF;color:#6100DB'], note: ['Note', 'background:#F1F2F5;color:#5F6775'],
  timeoff: ['Time off', 'background:#FEF3C7;color:#92400E'], tracker: ['Logged to tracker', 'background:#DCFCE7;color:#166534'],
  settings: ['Settings', 'background:#F1F2F5;color:#5F6775'], feedback: ['Feedback', 'background:#F2E4FF;color:#6100DB']
};
function seenAt() { if (S.actSeen === null) { try { S.actSeen = localStorage.getItem('kh_act_seen') || ''; } catch (e) { S.actSeen = ''; } } return S.actSeen; }
function markSeen(d) { const top = d.activity[0]; if (!top) return; try { localStorage.setItem('kh_act_seen', top.at); } catch (e) {} }
function unseenCount(d) { const s = seenAt(); return d.activity.filter(a => !s || a.at > s).length; }
function activity(d, T) {
  const mine = id => { const i = d.items.find(x => x.id === id); return i && d.meTeam && i.team.indexOf(d.meTeam) !== -1; };
  const F = { all: () => true, mine: a => mine(a.id), delivered: a => a.type === 'delivered' || (a.type === 'stage' && /Delivered/.test(a.text)), timeline: a => a.type === 'timeline' };
  const list = d.activity.filter(F[S.actFilter] || F.all);
  const seen = S.prevSeen;
  const dayOf = x => { const k = new Date(x.getFullYear(), x.getMonth(), x.getDate()); const diff = Math.round((T - k) / 864e5); return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : DOW[k.getDay()] + ', ' + fmt(k); };
  let lastDay = '', rows = '';
  list.slice(0, 150).forEach(a => {
    const day = dayOf(a.d);
    if (day !== lastDay) { rows += `<div class="aday">${esc(day)}</div>`; lastDay = day; }
    const item = d.items.find(x => x.id === a.id);
    const [lab, sty] = ACT[a.type] || [a.type, 'background:#F1F2F5;color:#5F6775'];
    rows += `<div class="act ${seen && a.at > seen ? 'unseen' : ''}">
      <span class="stat" style="${sty}">${esc(lab)}</span>
      <div class="main"><div class="row" style="gap:6px"><b>${esc(a.who || 'Someone')}</b><span class="sub">${clock(a.d)}</span>${item ? `<button class="alink" data-open="${esc(a.id)}">${esc(a.title)}</button>` : `<span class="sub">${esc(a.title)}</span>`}</div>
        <div class="atext">${esc(a.text)}</div></div>
      ${a.link ? `<a class="sub" href="${esc(a.link)}" target="_blank" rel="noopener" style="white-space:nowrap">Basecamp ${I.ext}</a>` : ''}</div>`;
  });
  const sy = d.sync || {};
  const poll = sy.poll ? 'Replies checked every 15 minutes · last check ' + whenLabel(sy.poll.at, T) : 'Replies are checked every 15 minutes';
  const counts = { all: d.activity.length, mine: d.activity.filter(F.mine).length, delivered: d.activity.filter(F.delivered).length, timeline: d.activity.filter(F.timeline).length };
  return `<section class="card"><div class="row between"><div style="display:flex;flex-direction:column;gap:2px"><h2>Activity</h2><span class="sub">${esc(poll)} · this page refreshes every 5 minutes</span></div>
    <div class="row">${[['all', 'All'], ['mine', 'Mine'], ['delivered', 'Client deliveries'], ['timeline', 'Timeline changes']].map(([k, l]) => `<button class="pill ${S.actFilter === k ? 'on' : ''}" data-afilter="${k}">${l} (${counts[k]})</button>`).join('')}</div></div>
    ${rows ? `<div class="feed">${rows}</div>` : '<div class="empty">Nothing here yet. Replies, client deliveries, timeline changes and dashboard edits show up as they happen.</div>'}</section>`;
}

function overview(d, T, H, hz, x) {
  const dueWeek = d.items.filter(i => i.open && i.e && i.e >= T && i.e <= x.wkE).length;
  const dueNext = d.items.filter(i => i.open && i.e && i.e > x.wkE && i.e <= x.nwE).length;
  const people = d.people.filter(p => S.owner === 'All' || p.name === S.owner);
  const free = d.people.reduce((t, p) => { const f = availFor(p, hz.s, hz.e) - loadFor(p.name, hz.s, hz.e); return t + (f > 0 ? f : 0); }, 0);
  const unstaffed = d.items.filter(i => i.open && !i.team.length && i.e && i.e >= hz.s && i.s <= hz.e).reduce((t, i) => t + itemLoad(i, hz.s, hz.e), 0);
  const k = [
    ['Open', x.openItems.length, 'Excluding triage, on hold and dismissed', 'var(--navy)'],
    ['Due this week', dueWeek, fmt(x.wkS) + ' to ' + fmt(x.wkE), '#92400E'],
    ['Due next week', dueNext, fmt(add(x.wkS, 7)) + ' to ' + fmt(x.nwE), '#1E40AF'],
    ['Past due', x.overdue.length, 'Not yet delivered', '#B91C1C'],
    ['Team free days', free.toFixed(1), hz.label, '#047857'],
    ['To be staffed', unstaffed.toFixed(1), 'Days with no owner · ' + hz.label, '#92400E']
  ];
  let h = `<div class="kpis">${k.map(([l, v, s, c]) => `<div class="kpi"><span class="l">${l}</span><span class="v" style="color:${c}">${v}</span><span class="s">${esc(s)}</span></div>`).join('')}</div>`;

  // Timeline
  const B = bucketsFor(hz), nB = B.length;
  const bpos = dt => { for (let i = 0; i < nB; i++) { const b = B[i]; if (dt < b.s) return i; const len = Math.round((b.e - b.s) / 864e5) + 1; if (dt <= b.e) return i + Math.round((dt - b.s) / 864e5) / len; } return nB; };
  const pct = v => v / nB * 100;
  const colW = hz.gran === 'day' ? (nB === 1 ? 600 : 190) : hz.gran === 'week' ? 120 : 300;
  const usedClients = {};
  const todayStyle = T >= hz.s && T <= hz.e ? `left:${pct(bpos(T) + (hz.gran === 'day' ? 0.5 : 0.1))}%` : 'display:none';
  const lanes = (S.owner === 'All' ? [{ name: 'To be staffed', p: null }] : []).concat(people.map(p => ({ name: p.name, p })));
  const SOLID = ['In progress', 'Internal review', 'Client review', 'Revisions'];
  const laneHtml = lanes.map(({ name, p }) => {
    const owner = p ? p.name : '';
    // Load strip: one cell per column, colored by how booked this person is (gray when out)
    const strip = B.map(b => {
      const used = loadFor(owner, b.s, b.e), avail = p ? availFor(p, b.s, b.e) : 0;
      let bg = '#DCFCE7', fg = '#14532D', lab;
      if (!p) { lab = used > 0.05 ? used.toFixed(1) + ' d' : '—'; bg = used > 0.05 ? '#FFF7ED' : '#F9FAFB'; fg = used > 0.05 ? '#9A3412' : '#6B7280'; }
      else if (avail === 0) { lab = used > 0.05 ? 'Out · ' + used.toFixed(1) + ' d' : 'Out'; bg = used > 0.05 ? '#FEE2E2' : '#F1F2F5'; fg = used > 0.05 ? '#7F1D1D' : '#5F6775'; }
      else { const v = Math.round(used / avail * 100); lab = v + '%'; if (v > 100) { bg = '#FEE2E2'; fg = '#7F1D1D'; } else if (v >= 70) { bg = '#FEF3C7'; fg = '#78350F'; } }
      return `<span class="lc" style="background:${bg};color:${fg}" title="${p ? used.toFixed(1) + ' of ' + avail.toFixed(1) + ' d booked' : used.toFixed(1) + ' d with no owner'}">${lab}</span>`;
    }).join('');
    // Time off, holidays and Summer Fridays: hatched, labeled
    const tints = B.map((b, i) => {
      const hols = []; for (let dd = b.s; dd <= b.e; dd = add(dd, 1)) if (isWeekday(dd) && HOL[key(dd)]) hols.push(HOL[key(dd)]);
      const offs = p ? p.off.filter(o => o.e >= b.s && o.s <= b.e) : [];
      const summer = hz.gran === 'day' && p && isSummerFri(b.s) && !hols.length;
      const halves = offs.length && offs.every(o => o.half) ? [...new Set(offs.map(o => o.part).concat(summer ? ['PM'] : []))] : summer && !offs.length ? ['PM'] : [];
      const half = hz.gran === 'day' && !hols.length && halves.length === 1 ? halves[0] : '';
      const label = hols.length ? (hz.gran === 'day' ? 'Holiday · ' + hols[0] : hols.length + (hols.length === 1 ? ' holiday' : ' holidays'))
        : offs.length ? offs.map(o => o.type + (o.half && hz.gran === 'day' ? ' · ' + o.part : '')).join(', ') : summer ? 'Summer Friday · PM' : '';
      const off = hols.length || offs.length || summer;

      if (!off && !outAll) return `<span class="tint" style="left:${pct(i)}%;width:${pct(1)}%"></span>`;

      .map(i => { const r = owner && onIt(i, owner) ? winRange(i, owner) : [i.s, i.e]; return { i, s: r[0], e: r[1], ov: !!owner && i.overs.indexOf(owner) !== -1 && i.team.length > 1 }; })

      .sort((a, b) => (a.ov - b.ov) || (PR[a.i.priority] ?? 1) - (PR[b.i.priority] ?? 1) || a.s - b.s);
    const rows = [];
    let yTop = 0;
    const rowH = [];
    const bars = mine.map(({ i, s: bS, e: bE, ov }) => {
      let r = rows.findIndex((row, k) => (rowH[k] === (ov ? 26 : 40)) && row.every(o => o.e < bS || o.s > bE));
      if (r === -1) { r = rows.length; rows.push([]); rowH.push(ov ? 26 : 40); }
      rows[r].push({ s: bS, e: bE });
      const top = 6 + rowH.slice(0, r).reduce((t, h) => t + h, 0);
      const atDue = +bE === +i.e;
      const [c, tint] = CLIENT[i.client]; usedClients[i.client] = 1;
      const l = bpos(maxD(bS, hz.s)), rr = bpos(add(minD(bE, hz.e), 1)), w = Math.max(rr - l, 0.2);
      const cutL = bS < hz.s, cutR = bE > hz.e, past = atDue && i.e < T, dueToday = atDue && +i.e === +T;
      const solid = !i.tent && !ov && SOLID.indexOf(i.stage) !== -1;
      const look = ov ? 'background:#EEF0F3;color:#374151;border:0'
        : i.tent ? `background:repeating-linear-gradient(45deg,${tint} 0 6px,#fff 6px 12px);color:${c};border:1.5px dashed ${c}`
        : solid ? `background:${c};color:#fff;border:0`
        : `background:${tint};color:${c};border:1.5px solid ${c}`;
      const wide = w / nB >= 0.09 || (nB <= 5 && w >= 0.6);
      // WBS milestones as diamonds; review and revisions shaded
      let segs = '';
      if (i.wbs && !ov) {
        const rel = dt => (bpos(dt) - l) / w * 100;
        segs = i.wbs.map(x => {
          if (x.s < maxD(bS, hz.s) || x.s > minD(bE, hz.e)) return '';
          if (x.kind === 'work') return '';
          const mid = (bpos(x.s) + bpos(add(x.s, 1))) / 2;
          return `<span class="dm" title="${esc(x.label)}: ${DOW[x.s.getDay()]}, ${fmt(x.s)}" style="left:${(mid - l) / w * 100}%;background:${solid ? '#fff' : c}"></span>`;
        }).join('');
        if (i.rwS && i.rwS <= bE && i.e >= bS) { const a2 = Math.max(0, rel(maxD(add(i.rwS, 1), maxD(bS, hz.s)))), b2 = Math.min(100, rel(add(minD(i.e, hz.e), 1))); if (b2 > a2) segs = `<span class="wseg" style="left:${a2}%;width:${b2 - a2}%;background:${solid ? 'rgba(255,255,255,.2)' : 'rgba(17,24,39,.06)'}"></span>` + segs; }
      }
      const nowStep = wbsNow(i, T);
      const cv = owner && !onIt(i, owner) ? coverFor(i, owner, hz.s, hz.e) : null;
      const days = i.est ? (owner && !cv ? daysFor(i, owner) : i.est) : 0;
      const meta = [];
      if (ov) meta.push('oversight · ' + days.toFixed(1) + ' d');
      else {
        meta.push(esc(i.client) + (i.sub ? ' · ' + esc(i.sub) : ''));
        if (cv) meta.push('covering for ' + esc(cv.from));
        if (i.paused) meta.push(esc(i.stage) + ' · nothing booked');
        else if (i.revAllow !== undefined) meta.push('in review · ' + (i.revAllow * (owner && i.est ? daysFor(i, owner) / i.est : 1)).toFixed(1) + ' d left');
        else meta.push(i.est ? (owner && i.team.length > 1 && !cv ? days.toFixed(1) + ' of ' + i.handsEst.toFixed(1) + ' d' : i.handsEst.toFixed(1) + ' d') : 'no estimate');
        if (owner && onIt(i, owner) && winOf(i, owner) !== 'all') meta.push(WIN_LABEL[winOf(i, owner)]);

      <select class="like" data-likely="${esc(i.id)}" aria-label="Likelihood">${['Likely', 'Maybe', 'Long shot'].map(x => `<option ${x === (i.likelihood || 'Likely') ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <div class="ptrack">${i.s && i.e && i.e >= W0 && i.s <= AX ? `<span class="pbar" style="left:${l}%;width:${Math.max(1.5, r - l)}%;background:repeating-linear-gradient(45deg,${CLIENT[i.client][1]} 0 6px,#fff 6px 12px);border:1.5px dashed ${c};opacity:${0.4 + 0.6 * likeOf(i)}" title="${i.s ? fmt(i.s) : ''} – ${i.e ? fmt(i.e) : ''}"></span>` : `<span class="sub" style="position:absolute;left:8px;top:8px">${i.e ? 'Outside the next 13 weeks' : 'No dates yet'}</span>`}</div>

      ${S.book.open ? '' : `<button class="btn primary" data-act="book-open">${I.plus}Book work</button>`}</div>
    ${form}

      ${list.length ? `<div class="plist"><div class="prow head"><span></span><span></span>${axis}<span></span></div>${list.sort((a, b) => (a.s || a.e || 0) - (b.s || b.e || 0)).map(row).join('')}</div>` : '<div class="empty">Nothing here.</div>'}</section>`).join('')}`;
}
const key2 = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');

const CHIP = { Overdue: 'background:#FCE4E4;color:#991B1B', 'This week': 'background:#FEF3C7;color:#92400E', 'Next week': 'background:#DBEAFE;color:#1E40AF', Done: 'background:#D1FAE5;color:#065F46' };
function timingOf(i, T) {
  if (i.stage === 'Delivered') return 'Done';
  if (!i.e) return 'No date';
  if (i.e < T) return 'Overdue';
  const m = monday(T);
  if (i.e <= add(m, 6)) return 'This week';
  if (i.e <= add(m, 13)) return 'Next week';
  return fmt(i.e);
}
const RAILS = ['Blocked', 'On hold'], STUCK_IN = ['Internal review', 'Client review', 'Revisions', 'Blocked'];
function inStage(i, T) { const x = P(i.stageSince) || P(i.added); return x ? Math.max(0, Math.round((T - x) / 864e5)) : null; }
function boardCard(i, T, stages) {
  const n = inStage(i, T), stuck = n !== null && n > 7 && STUCK_IN.some(x => i.stage.indexOf(x) !== -1 || x.indexOf(i.stage) !== -1);
  const since = n === null ? '' : `<span class="sub" title="Days in this stage">In ${esc(i.stage)} · ${n} d</span>${stuck ? `<span class="stuck">Stuck ${n} d</span>` : ''}`;
  if (S.compact) {
    const t = timingOf(i, T);
    return `<div class="kwrap"><button class="kcard compact" draggable="true" data-card="${esc(i.id)}" data-open="${esc(i.id)}" style="border-left:4px solid ${CLIENT[i.client][0]};${i.tent ? 'border-style:dashed;' : ''}${S.dragId === i.id ? 'opacity:.45;' : ''}">
      <span class="ktitle" title="${esc(i.title)}">${esc(i.title)}</span>
      <span class="row between" style="width:100%;flex-wrap:nowrap;gap:6px"><span class="sub" style="white-space:nowrap;${t === 'Overdue' ? 'color:#B91C1C;font-weight:700' : ''}">${i.e ? fmt(i.e) : 'No date'}</span>${stuck ? `<span class="stuck">Stuck ${n} d</span>` : ''}<span style="display:flex;margin-left:auto">${i.team.length ? i.team.slice(0, 3).map(x => `<span class="av mini" title="${esc(x)}">${esc(initials(x))}</span>`).join('') : '<span class="sub" style="color:#92400E;font-weight:700">No owner</span>'}</span></span></button></div>`;
  }
  return (i => { const t = timingOf(i, T); const nxt = stages[stages.indexOf(i.stage) + 1]; return `<div class="kwrap"><button class="kcard" draggable="true" data-card="${esc(i.id)}" data-open="${esc(i.id)}" style="border-top-color:${CLIENT[i.client][0]};${t === 'Overdue' ? 'border-color:#F3B4B4;border-top-color:' + CLIENT[i.client][0] + ';' : ''}${i.tent ? 'border-style:dashed;' : ''}${S.dragId === i.id ? 'opacity:.45;' : ''}">
        <span class="row between" style="width:100%;flex-wrap:nowrap"><span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:${CLIENT[i.client][0]}">${esc(i.client)}${i.sub ? ' · ' + esc(i.sub) : ''}</span><span class="chip" style="${CHIP[t] || 'background:#F3F4F6;color:#4B5563'}">${esc(t)}</span></span>
        <span style="font-weight:600;line-height:1.35">${esc(i.title)}</span>
        ${since ? `<span class="row" style="gap:6px">${since}</span>` : ''}
        ${i.tlFlag ? `<span class="tlchip" title="${esc((i.tlFlag.changes || []).join('; '))}">Timeline changed · ${esc(fmt(new Date(i.tlFlag.at)))}</span>` : ''}
        ${i.wbs ? (() => { const n = wbsNow(i, T); return n ? `<span class="sub" style="color:var(--ink)"><b>${n.s <= T ? 'Now' : 'Next'}:</b> ${esc(n.label)} · ${n.kind === 'milestone' || +n.s === +n.e ? DOW[n.s.getDay()] + ' ' + fmt(n.s) : 'through ' + fmt(n.e)}${i.mismatch ? ' <span style="color:#B45309;font-weight:700" title="WBS and Basecamp due date differ">· dates differ</span>' : ''}</span>` : ''; })() : ''}
        <span class="row between sub" style="width:100%;flex-wrap:nowrap"><span>${i.e ? fmt(i.e) : 'No date'}${i.est ? ' · ' + i.est.toFixed(1) + ' d' : ''}${noteCount(i.id) ? ` · <span title="Notes" style="color:var(--accent);font-weight:700">💬 ${noteCount(i.id)}</span>` : ''}${i.newReplies ? ` · <span title="Basecamp replies this week" style="color:var(--ink);font-weight:700">↩ ${i.newReplies}</span>` : ''}</span>
          <span style="display:flex;padding-left:6px">${i.team.length ? i.team.map(n => `<span class="av mini" title="${esc(n)} (${i.roleOf(n)})" style="${n === i.lead ? 'background:var(--brand);color:#fff' : ''}">${esc(initials(n))}</span>`).join('') : '<span style="color:#92400E;font-weight:700">No owner</span>'}</span></span>
      </button><div class="kact" role="group" aria-label="Quick actions">${nxt ? `<button title="Move to ${esc(nxt)}" data-act="next-stage" data-id="${esc(i.id)}" data-stage="${esc(nxt)}">→ ${esc(nxt)}</button>` : ''}<button title="Add a note" data-act="quick-note" data-id="${esc(i.id)}">Note</button>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener" title="Open in Basecamp">${I.ext}</a>` : ''}</div></div>`; })(i);
}
function board(d, T) {
  const all = d.lists.stages.filter(s => (S.showTriage || s !== 'Needs triage') && s !== 'Dismissed');
  const stages = all.filter(s => RAILS.indexOf(s) === -1), rails = all.filter(s => RAILS.indexOf(s) !== -1);
  const wk = monday(T), PRI = { High: 0, Medium: 1, Low: 2 };
  const recent = i => { const x = P(i.stageSince) || i.e || P(i.added); return !x || x >= add(T, -14); };
  let base = d.items.filter(i => i.stage !== 'Dismissed' && (S.owner === 'All' || onIt(i, S.owner)) && (!S.bClient || i.client === S.bClient))
    .filter(i => S.bTiming === 'overdue' ? i.e && i.e < T && i.stage !== 'Delivered' : S.bTiming === 'week' ? i.e && i.e >= wk && i.e <= add(wk, 6) : S.bTiming === 'next' ? i.e && i.e >= add(wk, 7) && i.e <= add(wk, 13) : true);
  const olderN = base.filter(i => i.stage === 'Delivered' && !recent(i)).length;
  if (!S.bOlder) base = base.filter(i => i.stage !== 'Delivered' || recent(i));
  base.sort(S.bSort === 'priority' ? (a, b) => (PRI[a.priority] ?? 1) - (PRI[b.priority] ?? 1) || (a.e || 9e15) - (b.e || 9e15) : (a, b) => (a.e || 9e15) - (b.e || 9e15));
  const triageN = d.items.filter(i => i.stage === 'Needs triage').length;
  const stuckN = base.filter(i => { const n = inStage(i, T); return n !== null && n > 7 && STUCK_IN.some(x => i.stage.indexOf(x) !== -1 || x.indexOf(i.stage) !== -1); }).length;
  const clients = [...new Set(d.items.filter(i => i.stage !== 'Dismissed').map(i => i.client))].sort();
  const groups = S.boardGroup === 'person' ? d.people.map(p => [p.name, base.filter(i => onIt(i, p.name))]).concat([['No owner', base.filter(i => !i.team.length)]]).filter(g => g[1].length)
    : S.boardGroup === 'client' ? clients.map(c => [c, base.filter(i => i.client === c)]).filter(g => g[1].length)
    : [['', base]];
  const colW = S.compact ? 180 : 188;
  const cols = its => {
    const tmpl = stages.map(() => `minmax(${colW}px,1fr)`).concat(rails.map(r => S.boardOpen[r] ? `minmax(${colW}px,1fr)` : '44px')).join(' ');
    return `<div class="cols" style="grid-template-columns:${tmpl};min-width:${stages.length * (colW + 12) + rails.reduce((t, r) => t + (S.boardOpen[r] ? colW + 12 : 56), 0)}px">
      ${stages.concat(rails).map(st => { const list = its.filter(i => i.stage === st), rail = RAILS.indexOf(st) !== -1;
        if (rail && !S.boardOpen[st]) return `<button class="col rail ${S.overCol === st ? 'over' : ''} ${list.length ? 'has' : ''}" data-col="${esc(st)}" data-rail="${esc(st)}" title="Show ${esc(st)}"><span class="count" style="background:#fff">${list.length}</span><span class="rtext">${esc(st)}</span></button>`;
        return `<div class="col ${S.overCol === st ? 'over' : ''}" data-col="${esc(st)}">
        <div class="row between" style="padding:2px 4px 4px"><b>${esc(st)}</b><span class="row" style="gap:4px"><span class="count" style="background:#fff">${list.length}</span>${rail ? `<button class="x" style="width:24px;height:24px" data-rail="${esc(st)}" aria-label="Collapse ${esc(st)}">${I.close}</button>` : ''}</span></div>
        ${list.map(i => boardCard(i, T, all)).join('') || '<div class="empty" style="text-align:center">Drop a card here</div>'}
        ${st === 'Delivered' && olderN && S.boardGroup === 'none' ? `<button class="pill" data-act="b-older" style="align-self:center">${S.bOlder ? 'Hide older' : 'Show older (' + olderN + ')'}</button>` : ''}
      </div>`; }).join('')}</div>`;
  };
  const seg = (k, opts) => `<span class="bseg">${opts.map(([v, l]) => `<button class="${S[k] === v ? 'on' : ''}" data-bset="${k}" data-v="${v}">${l}</button>`).join('')}</span>`;
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="row between"><div style="display:flex;flex-direction:column;gap:2px"><h2>Deliverables by stage</h2><span class="sub">Drag a card to change its stage. Delivered shows the last 14 days.${stuckN ? ` <b style="color:#B45309">${stuckN} stuck over 7 days in review or blocked.</b>` : ''}</span></div>
      <div class="row"><button class="pill ${S.showTriage ? 'on' : ''}" data-triage="1">${S.showTriage ? 'Hide' : 'Show'} Needs triage (${triageN})</button><button class="pill" data-act="bulk">Clean up in bulk</button></div></div>
    <div class="row btools">
      <span class="lbl">Group</span>${seg('boardGroup', [['none', 'None'], ['person', 'Person'], ['client', 'Client']])}
      <span class="lbl">Due</span>${seg('bTiming', [['all', 'Any'], ['overdue', 'Overdue'], ['week', 'This week'], ['next', 'Next week']])}

    ${groups.map(([g, its]) => `${g ? `<div class="row" style="gap:8px;margin-top:4px"><h3>${esc(g)}</h3><span class="count">${its.length}</span></div>` : ''}<div class="board">${cols(its)}</div>`).join('') || '<div class="empty">Nothing matches these filters.</div>'}
  </div>`;
}

/* ===== Overlay layer: detail drawer and add form ===== */
function wbsBlock(i, T) {
  const now = wbsNow(i, T);
  const range = x => (x.kind === 'milestone' || +x.s === +x.e) ? DOW[x.s.getDay()] + ', ' + fmt(x.s) : fmt(x.s) + ' – ' + fmt(x.e);

    ${i.mismatch ? `<div class="callout warn">The WBS ends ${DOW[i.wbsEnd.getDay()]}, ${fmt(i.wbsEnd)}, but Basecamp says it's due ${DOW[i.dueBC.getDay()]}, ${fmt(i.dueBC)}. Update the to-do's due date, or confirm ${fmt(i.dueBC)} is an internal date.</div>` : ''}

      const st = x.e < T ? 'done' : x === now && x.s <= T ? 'now' : '';
      return `<div class="st ${st}"><span class="ic ${x.kind === 'milestone' ? 'ms' : ''}" style="background:${st === 'done' ? '#CBD5E1' : x.kind === 'work' ? c : '#fff'};${x.kind === 'milestone' && st !== 'done' ? 'box-shadow:inset 0 0 0 2px ' + c : ''}"></span>
        <span><b style="font-weight:${st === 'now' ? 800 : 600}">${esc(x.label)}</b>${st === 'now' ? ' <span class="stat" style="background:#fff;color:var(--accent);padding:1px 8px;margin-left:4px">Now</span>' : ''}${x.note ? ' <span class="sub">· ' + esc(x.note) + '</span>' : ''}</span>
        <span class="sub" style="white-space:nowrap">${range(x)}</span></div>`;
    }).join('')}</div></div>`;
